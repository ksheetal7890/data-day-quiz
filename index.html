<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Data Day Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app, three routes (player phone / TV / host). Player & TV are centred columns; host is a two-pane console. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9eef7; --fg:#0f1941; --muted:#5b6480; --line:#d5dceb;
  --accent:#2175d9; --accent-ink:#ffffff; --navy:#0f1941;
  --good:#1d8a4e; --bad:#c43d3d; --warn:#c7811a;
  --c1:#2175d9; --c2:#f0a63a; --c3:#5b9e6e; --c4:#9a6bd6; --c5:#d96a9b; --c6:#49a7b4; --c7:#9aa3b8;
  --display:'Sora',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  --radius:14px; --shadow:0 8px 28px rgba(15,25,65,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1230; --surface:#141d3f; --surface2:#1c2750; --fg:#eef2fb; --muted:#9aa6c8; --line:#2b3764;
  --accent:#4f93ea; --accent-ink:#06102a; --navy:#eef2fb; --good:#4fbf7e; --bad:#ef6e6e; --warn:#e9a84a;
  --c1:#4f93ea; --c2:#f3b65a; --c3:#6fb886; --c4:#b08ae6; --c5:#e68ab5; --c6:#63bec9; --c7:#7f88a3;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1230; --surface:#141d3f; --surface2:#1c2750; --fg:#eef2fb; --muted:#9aa6c8; --line:#2b3764;
  --accent:#4f93ea; --accent-ink:#06102a; --navy:#eef2fb; --good:#4fbf7e; --bad:#ef6e6e; --warn:#e9a84a;
  --c1:#4f93ea; --c2:#f3b65a; --c3:#6fb886; --c4:#b08ae6; --c5:#e68ab5; --c6:#63bec9; --c7:#7f88a3;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px;padding-inline:16px;min-height:100%}
.tvwrap{max-width:1400px;margin:0 auto;padding-block:20px;padding-inline:24px;min-height:100%;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--display);font-size:15px}
.btn.secondary{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.accent{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.timer{font-family:var(--display);font-weight:800;font-size:28px;min-width:64px;text-align:center;border-radius:12px;background:var(--surface2);padding:4px 10px}
.timer.low{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.options{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px 14px;color:var(--fg);width:100%}
.opt .key{font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.chosen{border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface2))}
.opt:disabled{cursor:default}
.chart{background:var(--surface2);border-radius:12px;padding:10px;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;font-family:var(--body)}
.chart table{border-collapse:collapse;width:100%;font-size:14px}
.chart th,.chart td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.chart th:first-child,.chart td:first-child{text-align:left}
.chart th{font-family:var(--display);font-size:12px;color:var(--muted)}
.lb{display:flex;flex-direction:column;gap:6px}
.lb .r{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.lb .r.me{outline:2px solid var(--accent)}
.lb .r .rank{font-family:var(--display);font-weight:800;color:var(--muted)}
.lb .r .pts{font-family:var(--display);font-weight:800}
.lb .r:nth-child(1) .rank{color:var(--c2)}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi>div{background:var(--surface2);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:24px}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.vote{display:grid;grid-template-columns:28px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.vote .bar{height:14px}
.vote.correct .bar>i{background:var(--good)}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.bands>div{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.bands b{display:block;font-family:var(--display);font-size:26px}
.bands small{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--surface2);border:0;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--fg)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
details.q{background:var(--surface2);border-radius:12px;padding:10px 14px}
details.q summary{cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.q .body{display:flex;flex-direction:column;gap:10px;padding-top:10px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:90px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);z-index:9}
.tvhead{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.tvmain{display:grid;grid-template-columns:2fr 1fr;gap:18px;flex:1;min-height:0}
@media (max-width:900px){.tvmain{grid-template-columns:1fr}}
.tv .card{padding:24px}
.tv h1{font-size:40px}
.tv h2{font-size:28px}
.tv .opt{font-size:20px;padding:14px 18px}
.tv .lb .r{font-size:20px;padding:10px 16px}
.tv .timer{font-size:40px}
.qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;width:fit-content;margin:0 auto}
.qr img,.qr canvas{display:block}
.qr-url{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin-top:8px}
.resultcard{width:100%;max-width:520px;border-radius:12px;display:block;margin:0 auto}
.recap{display:flex;flex-direction:column;gap:8px}
.recap .i{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface2);border-radius:10px}
.recap .i p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.hostlayout{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1300px;margin:0 auto;padding-block:16px;padding-inline:16px}
@media (max-width:900px){.hostlayout{grid-template-columns:1fr}}
.phase{display:inline-flex;gap:8px;align-items:center;font-family:var(--display);font-weight:700}
.phase i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.phase.live i{background:var(--good)}
.notice{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-left:4px solid var(--warn);padding:12px 14px;border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.offline{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--warn);color:#1a1200;text-align:center;font-weight:600;padding:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border-radius:999px;padding:6px 14px;font-weight:600;animation:pop .35s ease-out}
.tv .chip{font-size:20px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.prize{border:3px solid var(--c2);text-align:center}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:8px 12px}
.brand img{display:block}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function bandFor(cfg, pct){ const bs=[...(cfg.bands||[])].sort((a,b)=>a.min-b.min); let b=bs[0]||{name:"—",blurb:""}; for(const x of bs){ if(pct>=x.min) b=x; } return b; }
function roundScore(p, rid){ const r=(p.rounds||{})[rid]||{}; let pts=0, ms=0, ok=0; for(const q of Object.values(r)){ pts+=q.pts||0; ms+=q.ms||0; if(q.ok) ok++; } return {pts, ms, ok, n:Object.keys(r).length}; }
function roundBoard(players, rid){ return players.filter(p=>p.rounds&&p.rounds[rid]).map(p=>({...p, ...roundScore(p,rid)})).sort((a,b)=>b.pts-a.pts||a.ms-b.ms); }
function globalBoard(players, state, cfg){ const rounds=Object.keys(state.rounds||{}); return players.map(p=>{ let total=0,best=0,played=0,ms=0; for(const rid of rounds){ if(p.rounds&&p.rounds[rid]){ const s=roundScore(p,rid); total+=s.pts; best=Math.max(best,s.pts); played++; ms+=s.ms; } } return {...p, pts: cfg.globalMode==="best"?best:total, played, ms}; }).filter(p=>p.played>0).sort((a,b)=>b.pts-a.pts||a.ms-b.ms); }
function boardTitle(n, max=10){ return n<=max ? (n===1?"The only player so far":`All ${n} players`) : `Top ${max} of ${n} players`; }
function questionsForRound(cfg){ let qs=(cfg.questions||[]).filter(q=>q.enabled!==false); if(cfg.shuffleQuestions){ qs=[...qs]; for(let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; } } return qs; }
function qById(cfg,id){ return (cfg.questions||[]).find(q=>q.id===id); }
function timerFor(cfg,q){ return Number(q&&q.timerSec)||Number(cfg.timerSec)||45; }

/* ============================ CHART RENDERER (inline SVG) ============================ */
function renderChart(spec, tv=false){
  if(!spec||spec.type==="none") return "";
  const W=560, H=tv?300:260, pad={l:46,r:16,t:30,b:40};
  const ink="var(--fg)", mut="var(--muted)", grid="var(--line)";
  const t = spec.title ? `<text x="${W/2}" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="${ink}" font-family="Sora,sans-serif">${esc(spec.title)}</text>` : "";
  const note = spec.note ? `<p class="muted" style="font-size:13px;margin:8px 4px 0">${esc(spec.note)}</p>` : "";
  const nice = (lo,hi)=>{ const span=(hi-lo)||1; const raw=span/5; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/mag; const step=(n>=5?10:n>=2?5:n>=1?2:1)*mag/ (n>=5?1:1); const ticks=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9 && ticks.length<12; v+=step) ticks.push(+v.toFixed(6)); return ticks; };
  if(spec.type==="bar"||spec.type==="line"){
    const vals=spec.values, labels=spec.labels; const lo = spec.yMin!=null?spec.yMin:Math.min(0,...vals); const hi = spec.yMax!=null?spec.yMax:Math.max(...vals)*1.12;
    const x = i => pad.l + (W-pad.l-pad.r)*(spec.type==="bar"? (i+0.5)/vals.length : (vals.length===1?0.5:i/(vals.length-1)));
    const y = v => pad.t + (H-pad.t-pad.b)*(1-(v-lo)/(hi-lo));
    let g=""; for(const tv_ of nice(lo,hi)){ if(tv_<lo||tv_>hi) continue; g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(tv_)}" y2="${y(tv_)}" stroke="${grid}" stroke-width="1"/><text x="${pad.l-6}" y="${y(tv_)+4}" text-anchor="end" font-size="11" fill="${mut}">${tv_}${spec.unit||""}</text>`; }
    let m=""; if(spec.type==="bar"){ const bw=Math.min(56,(W-pad.l-pad.r)/vals.length*0.62); vals.forEach((v,i)=>{ const top=y(Math.max(v,lo)), base=y(lo); m+=`<rect x="${x(i)-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,base-top)}" rx="4" fill="var(--c1)"/>`; }); }
    else { const d=vals.map((v,i)=>`${i?"L":"M"}${x(i)} ${y(v)}`).join(" "); m+=`<path d="${d}" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round"/>`; vals.forEach((v,i)=>{ m+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--c1)" stroke="var(--surface2)" stroke-width="2"/>`; }); }
    const xl = labels.map((l,i)=>`<text x="${x(i)}" y="${H-pad.b+16}" text-anchor="middle" font-size="11" fill="${mut}">${esc(l)}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${g}<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(lo)}" y2="${y(lo)}" stroke="${mut}" stroke-width="1"/>${m}${xl}</svg>${note}`;
  }
  if(spec.type==="scatter"){
    const pts=spec.points; const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const xlo=0, xhi=Math.max(...xs)*1.15, ylo=0, yhi=Math.max(...ys)*1.15;
    const x=v=>pad.l+(W-pad.l-pad.r)*(v-xlo)/(xhi-xlo), y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-ylo)/(yhi-ylo));
    let g=""; for(const tv_ of nice(ylo,yhi)){ if(tv_>yhi) continue; g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(tv_)}" y2="${y(tv_)}" stroke="${grid}"/><text x="${pad.l-6}" y="${y(tv_)+4}" text-anchor="end" font-size="11" fill="${mut}">${tv_}</text>`; }
    for(const tv_ of nice(xlo,xhi)){ if(tv_>xhi) continue; g+=`<text x="${x(tv_)}" y="${H-pad.b+16}" text-anchor="middle" font-size="11" fill="${mut}">${tv_}</text>`; }
    const m=pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="7" fill="var(--c1)" stroke="var(--surface2)" stroke-width="2"/>${p[2]?`<text x="${x(p[0])+10}" y="${y(p[1])-8}" font-size="11" fill="${mut}">${esc(p[2])}</text>`:""}`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${g}<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(ylo)}" y2="${y(ylo)}" stroke="${mut}"/>${m}<text x="${W/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="${mut}">${esc(spec.xLabel||"")}</text><text transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="${mut}">${esc(spec.yLabel||"")}</text></svg>${note}`;
  }
  if(spec.type==="pie"){
    const total=spec.values.reduce((a,b)=>a+b,0); const cx=190, cy=H/2+10, r=Math.min(cx-20, (H-pad.t)/2-16); let a=-Math.PI/2, m="", leg="";
    const cols=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)"];
    spec.values.forEach((v,i)=>{ const b=a+2*Math.PI*v/total; const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(b), y2=cy+r*Math.sin(b); const big=(b-a)>Math.PI?1:0; m+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} Z" fill="${cols[i%cols.length]}" stroke="var(--surface2)" stroke-width="2"/>`; a=b; const lx=360+(i%2)*100, ly=pad.t+12+Math.floor(i/2)*18; leg+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" rx="2" fill="${cols[i%cols.length]}"/><text x="${lx+14}" y="${ly}" font-size="11" fill="${mut}">${esc(spec.labels[i])}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${m}${leg}</svg>${note}`;
  }
  if(spec.type==="table"){
    return `<div style="overflow-x:auto">${spec.title?`<div class="eyebrow" style="margin:2px 4px 8px">${esc(spec.title)}</div>`:""}<table><thead><tr>${spec.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${spec.rows.map(r=>`<tr>${r.map(c=>`<td class="num">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note}`;
  }
  return "";
}

const TEXT_LABELS = { joinEyebrow:"Join screen: small label", joinTitle:"Join screen: headline (also on the TV)", joinIntro:"Join screen: intro text", nickLabel:"Nickname field label", nickPlaceholder:"Nickname placeholder", joinButton:"Join button", inTitle:"After joining: title", waitingIdle:"Waiting between rounds", lobbyTitle:"Lobby: title", lobbyRules:"Lobby: scoring line", answerLocked:"After answering", timesUp:"Time's up", paused:"Timer paused", correct:"Reveal: correct label", wrong:"Reveal: wrong label", noAnswer:"Reveal: no answer label", whyLabel:"Explanation label", endEyebrow:"End of round: label above the level", recapTitle:"End of round: recap title", cardHint:"Result card hint", cardHeader:"Result card: header line", cardTagline:"Result card: tagline", allDayTitle:"All-day leaderboard title", levelsTitle:"TV: levels distribution title", roomVoted:"TV: vote bars title", tvScan:"TV: scan label", tvIdleBlurb:"TV: blurb between rounds", tvLobbyTitle:"TV: lobby title (countdown)", tvLobbySoon:"TV: lobby title (countdown over)", tvNoPlayers:"TV: lobby, nobody joined yet", prizeEyebrow:"Prize draw: label", prizeBlurb:"Prize draw: line under the winner", prizeYou:"Phone: you won", prizeYouBlurb:"Phone: you won, instructions" };

/* ============================ APP STATE ============================ */
const S = { sb:null, uid:null, hostUser:null, authError:null, offset:0, cfg:DEFAULT_CONFIG, cfgLoaded:false, cfgExists:false,
  state:{phase:"idle",rounds:{}}, players:[], ready:false, online:true, route:(location.hash||"").replace("#",""),
  nick: ls.get("dd_nick")||"", joined: ls.get("dd_joined")==="1", answerBusy:false, hostTab:"run", tick:0, lastAutoReveal:null,
  loginBusy:false, editNick:null, prizeLevel:"", lastRoundSeen:null };
const app=$("#app");
const now=()=>Date.now()+(S.offset||0);
const clean=o=>JSON.parse(JSON.stringify(o));
window.addEventListener("hashchange",()=>{ S.route=(location.hash||"").replace("#",""); lastHtml=""; render(); });

function applyBrand(){ const a=(S.cfg.accent||"").trim(); if(/^#[0-9a-fA-F]{6}$/.test(a)) document.documentElement.style.setProperty("--accent",a); else document.documentElement.style.removeProperty("--accent"); }

async function boot(){
  render();
  if(typeof SUPABASE_CONFIG==="undefined" || !SUPABASE_CONFIG.url || SUPABASE_CONFIG.url.includes("PASTE")){ S.authError="setup"; S.ready=true; render(); return; }
  const sb=supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
  S.sb=sb;
  try{ const t0=Date.now(); const {data,error}=await sb.rpc("server_time"); if(!error&&data){ const rtt=Date.now()-t0; S.offset=Number(data)-(t0+rtt/2); } }catch(e){}
  // auth
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session&&session.user; if(u){ S.uid=u.id; S.hostUser=u.is_anonymous?null:u; S.authError=null; } else { S.uid=null; S.hostUser=null; } S.ready=true; lastHtml=""; render(); maybeSeed(); });
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ if(S.route!=="host"){ const {error}=await sb.auth.signInAnonymously(); if(error){ S.authError=error.message; S.ready=true; render(); } } else { S.ready=true; render(); } }
  // data
  await Promise.all([loadConfig(), loadState(), loadPlayers()]);
  S.ready=true; lastHtml=""; render();
  const ch=sb.channel("quiz")
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},()=>loadConfig())
    .on("postgres_changes",{event:"*",schema:"public",table:"state"},()=>loadState())
    .on("postgres_changes",{event:"*",schema:"public",table:"players"},()=>loadPlayers())
    .subscribe(status=>{ const ok=status==="SUBSCRIBED"; if(ok!==S.online){ S.online=ok; lastHtml=""; render(); } if(ok){ loadState(); loadPlayers(); } });
  setInterval(()=>{ S.tick++; if(S.state.phase==="question"||S.state.phase==="lobby") render(true); hostAutoAdvance(); },500);
  setInterval(()=>{ if(!S.online || S.state.phase==="question"){ loadState(); } if(!S.online) loadPlayers(); },4000); // safety net if realtime drops
}
async function loadConfig(){ const {data,error}=await S.sb.from("config").select("data").eq("id",1).maybeSingle(); if(error){ S.authError=error.message; render(); return; } S.cfgLoaded=true; S.cfgExists=!!data; if(data){ S.cfg={...DEFAULT_CONFIG, ...data.data}; S.cfg.texts={...DEFAULT_CONFIG.texts, ...(data.data.texts||{})}; } applyBrand(); render(); maybeSeed(); }
async function loadState(){ const {data}=await S.sb.from("state").select("data").eq("id",1).maybeSingle(); if(data){ S.state={rounds:{}, qIds:[], ...data.data}; render(); } }
async function loadPlayers(){ const {data}=await S.sb.from("players").select("id,nick,joined_at,last_round,rounds"); if(data){ S.players=data.map(p=>({id:p.id, nick:p.nick, joinedAt:p.joined_at, lastRound:p.last_round, rounds:p.rounds||{}})); render(); } }
let seeded=false;
async function maybeSeed(){ if(seeded||!S.hostUser||!S.cfgLoaded||S.cfgExists||!S.sb) return; seeded=true; const c=clean({...DEFAULT_CONFIG, playerUrl: playerUrl()}); const {error}=await S.sb.rpc("host_save_config",{p_data:c}); if(error) toast("Could not write defaults: "+error.message); else { toast("First run: default questions loaded"); loadConfig(); } }
async function hostRpc(action, payload){ const {data,error}=await S.sb.rpc("host_action",{p_action:action, p_payload:payload||{}}); if(error){ toast(error.message); return null; } if(data){ S.state={rounds:{}, qIds:[], ...data}; lastHtml=""; render(); } return data; }

/* ============================ RENDER ROUTER ============================ */
let lastHtml="";
function render(tickOnly=false){
  if(tickOnly && S.route==="host" && S.hostTab==="settings") return;
  let html;
  if(S.route==="tv") html=renderTV(); else if(S.route==="host") html=renderHost(); else html=renderPlayer();
  if(!S.online && S.route!=="tv") html=`<div class="offline">Reconnecting… answers will send when you're back online</div>`+html;
  if(html===lastHtml) return;
  const focus=document.activeElement; const fid=focus&&focus.id, sel=focus&&focus.selectionStart;
  app.innerHTML=html; lastHtml=html; afterRender();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
}
function afterRender(){
  const q=$("#qrbox"); if(q && window.QRCode){ q.innerHTML=""; try{ new QRCode(q,{text:playerUrl(),width:+q.dataset.size||220,height:+q.dataset.size||220,correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
  const rc=$("#resultcanvas"); if(rc) drawResultCard(rc);
}
function playerUrl(){ if(S.cfg.playerUrl) return S.cfg.playerUrl; try{ const u=new URL(location.href); u.hash=""; return u.toString(); }catch(e){ return location.href; } }
function remaining(){ const st=S.state; const end=st.qEndsAt||0; const ref=st.pausedAt?st.pausedAt:now(); return Math.max(0, Math.ceil((end-ref)/1000)); }
function currentQ(){ const id=(S.state.qIds||[])[S.state.qIndex||0]; return qById(S.cfg,id); }
function timerHtml(total){ const r=remaining(); const pct=total? Math.min(100,r/total*100) : 0; const paused=!!S.state.pausedAt; return `<div class="row" style="justify-content:space-between"><div class="timer num ${r<=10&&!paused?"low":""}">${paused?"⏸":r}</div><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div></div>${paused?`<p class="pill" style="margin:0">${esc(T("paused"))}</p>`:""}`; }
function T(k){ return (S.cfg.texts&&S.cfg.texts[k])||DEFAULT_CONFIG.texts[k]||""; }
function brandHtml(size){ const logo=S.cfg.logo? `<img src="${S.cfg.logo}" alt="" style="height:${size||22}px;width:auto;max-width:160px">` : `<span class="dot"></span>`; return `<div class="brand">${logo}<span>${esc(S.cfg.title)}</span></div>`; }
function head(sub){ return `<div class="row" style="justify-content:space-between;margin-bottom:14px">${brandHtml(22)}<span class="muted" style="font-size:13px">${sub||""}</span></div>`; }
function levelOf(p, rid){ const meta=(S.state.rounds||{})[rid]||{}; const sc=roundScore(p,rid); const pct=meta.maxPts?sc.pts/meta.maxPts*100:0; return bandFor(S.cfg,pct); }

/* ============================ PLAYER ============================ */
function renderPlayer(){
  const st=S.state, cfg=S.cfg;
  if(!S.ready) return `<div class="wrap"><div class="card">${head()}<p class="muted">Loading the quiz…</p></div></div>`;
  if(S.authError==="setup") return `<div class="wrap"><div class="card stack">${head()}<h2>Almost there</h2><p>The quiz isn't connected to a database yet. Paste your project URL and anon key into <code>supabase-config.js</code> (see the setup guide).</p></div></div>`;
  if(S.authError) return `<div class="wrap"><div class="card stack">${head()}<h2>Can't connect</h2><p class="muted">${esc(S.authError)}</p><p>Check your internet connection and reload. If it keeps happening, tell the booth host.</p></div></div>`;
  if(!S.sb || !S.uid) return `<div class="wrap"><div class="card">${head()}<p class="muted">Connecting…</p></div></div>`;
  const me=S.players.find(p=>p.id===S.uid);
  if(!S.joined || !me){
    return `<div class="wrap"><div class="card stack">${head()}<div><div class="eyebrow">${esc(T("joinEyebrow"))}</div><h1 style="font-size:34px;margin-top:6px">${esc(T("joinTitle"))}</h1></div><p class="muted">${esc(T("joinIntro"))}</p><form id="joinform" class="stack"><div class="field"><label class="f" for="nick">${esc(T("nickLabel"))}</label><input id="nick" maxlength="18" placeholder="${esc(T("nickPlaceholder"))}" value="${esc(S.nick)}" autocomplete="off" required></div><button class="btn" type="submit" ${S.answerBusy?"disabled":""}>${esc(T("joinButton"))}</button></form><p class="muted" style="font-size:13px">${S.players.length} player${S.players.length===1?"":"s"} joined so far</p></div></div>`;
  }
  const rid=st.roundId;
  if(st.phase==="idle"||!rid){ return `<div class="wrap stack"><div class="card stack">${head(esc(me.nick))}<h2>${esc(T("inTitle")).replace("{nick}",esc(me.nick))}</h2><p class="muted">${esc(T("waitingIdle"))}</p></div>${globalMini(me)}</div>`; }
  if(st.phase==="lobby"){ const secs=Math.max(0,Math.ceil(((st.lobbyEndsAt||0)-now())/1000)); const inRound=S.players.filter(p=>p.lastRound===rid).length; return `<div class="wrap"><div class="card stack">${head(esc(me.nick))}<div class="eyebrow">Round ${st.roundNo}</div><h2>${esc(T("lobbyTitle")).replace("{nick}",esc(me.nick))}</h2><p class="muted">Starts ${secs>0?`in <b class="num">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b>`:"any moment now"}. ${inRound} player${inRound===1?"":"s"} ready.</p><p class="muted" style="margin:0">${esc(T("lobbyRules")).replace("{points}",cfg.pointsCorrect).replace("{bonus}",cfg.speedBonusMax)}</p></div></div>`; }
  const q=currentQ(); const myAns = q && me.rounds && me.rounds[rid] && me.rounds[rid][q.id];
  if(st.phase==="question" && q){
    const total=timerFor(cfg,q); const r=remaining(); const locked=myAns||r<=0||S.answerBusy||st.pausedAt;
    return `<div class="wrap"><div class="card stack">${head(`Q${(st.qIndex||0)+1} of ${(st.qIds||[]).length}`)}${timerHtml(total)}<div class="chart">${renderChart(q.chart)}</div><p style="font-weight:600;margin:0">${esc(q.prompt)}</p><div class="options">${q.options.map((o,i)=>`<button class="opt ${myAns&&myAns.c===i?"chosen":""}" data-i="${i}" ${locked?"disabled":""}><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>${myAns?`<p class="pill accent" style="margin:0">${esc(T("answerLocked"))}</p>`:r<=0?`<p class="pill" style="margin:0">${esc(T("timesUp"))}</p>`:""}</div></div>`;
  }
  if(st.phase==="reveal" && q){
    const ok=myAns&&myAns.ok;
    return `<div class="wrap"><div class="card stack">${head(`Q${(st.qIndex||0)+1} of ${(st.qIds||[]).length}`)}<div class="row" style="justify-content:space-between"><span class="pill ${myAns?(ok?"good":"bad"):""}">${myAns?(ok?`${esc(T("correct"))} · +${myAns.pts} pts`:`${esc(T("wrong"))} · 0 pts`):`${esc(T("noAnswer"))} · 0 pts`}</span><span class="muted num">Round total: ${fmt(roundScore(me,rid).pts)}</span></div><div class="options">${q.options.map((o,i)=>`<button class="opt ${i===q.correct?"correct":(myAns&&myAns.c===i?"wrong":"")}" disabled><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><p style="margin:0"><b>${esc(T("whyLabel"))}</b> ${esc(q.explain)}</p></div></div>`;
  }
  if(st.phase==="board"){ const b=roundBoard(S.players,rid); const idx=b.findIndex(p=>p.id===S.uid); return `<div class="wrap"><div class="card stack">${head(`Round ${st.roundNo}`)}<h2>Leaderboard after Q${(st.qIndex||0)+1}</h2>${idx>=0?`<p class="muted">You're <b>#${idx+1}</b> of ${b.length} with <b class="num">${fmt(b[idx].pts)}</b> points.</p>`:""}${boardHtml(b.slice(0,10), S.uid)}</div></div>`; }
  if(st.phase==="ended"){
    const b=roundBoard(S.players,rid); const idx=b.findIndex(p=>p.id===S.uid); const meta=(st.rounds||{})[rid]||{}; const sc=roundScore(me,rid); const band=levelOf(me,rid); const qids=meta.qIds||st.qIds||[];
    const prize=st.prize&&st.prize.id===S.uid?`<div class="notice"><b>${esc(T("prizeYou"))}</b> ${esc(T("prizeYouBlurb"))}</div>`:"";
    return `<div class="wrap stack"><div class="card stack">${head(`Round ${st.roundNo} · final`)}${prize}<div class="eyebrow">${esc(T("endEyebrow"))}</div><div class="big">${esc(band.name)}</div><p class="muted" style="margin:0">${esc(band.blurb||"")}</p><div class="kpi"><div><b class="num">${fmt(sc.pts)}</b><span>points of ${fmt(meta.maxPts||0)}</span></div><div><b class="num">${sc.ok}/${qids.length}</b><span>correct</span></div><div><b class="num">${idx>=0?"#"+(idx+1):"—"}</b><span>of ${b.length} in this round</span></div></div><canvas id="resultcanvas" class="resultcard" width="1080" height="600" data-nick="${esc(me.nick)}" data-band="${esc(band.name)}" data-pts="${sc.pts}" data-rank="${idx>=0?idx+1:0}" data-n="${b.length}" data-ok="${sc.ok}" data-q="${qids.length}"></canvas><p class="muted" style="font-size:13px;text-align:center;margin:0">${esc(T("cardHint"))}</p></div><div class="card stack"><h2>${esc(T("recapTitle"))}</h2><div class="recap">${qids.map((id,i)=>{ const qq=qById(cfg,id); if(!qq) return ""; const a=((me.rounds||{})[rid]||{})[id]; const ok=a&&a.ok; return `<div class="i"><span class="pill ${a?(ok?"good":"bad"):""}">${ok?"✓":"✗"}</span><div><b>${i+1}. ${esc(qq.title)}</b><p>${esc(qq.explain)}</p></div><span class="num muted">${a?"+"+a.pts:"0"}</span></div>`; }).join("")}</div></div>${globalMini(me)}</div>`;
  }
  return `<div class="wrap"><div class="card">${head()}<p class="muted">${esc(T("waitingIdle"))}</p></div></div>`;
}
function globalMini(me){ const g=globalBoard(S.players,S.state,S.cfg); if(!g.length) return ""; const idx=g.findIndex(p=>p.id===me.id); return `<div class="card stack"><div class="eyebrow">${esc(T("allDayTitle"))} (${S.cfg.globalMode==="best"?"best round":"total points"})</div>${idx>=0?`<p class="muted" style="margin:0">You're #${idx+1} of ${g.length} players today.</p>`:""}${boardHtml(g.slice(0,10), me.id)}</div>`; }
function boardHtml(list, meId, startRank=1){ if(!list.length) return `<p class="muted">No scores yet.</p>`; return `<div class="lb">${list.map((p,i)=>`<div class="r ${p.id===meId?"me":""}"><span class="rank num">#${startRank+i}</span><span>${esc(p.nick)}</span><span class="pts num">${fmt(p.pts)}</span></div>`).join("")}</div>`; }

function drawResultCard(c){
  const ctx=c.getContext("2d"); const W=c.width,H=c.height; const d=c.dataset;
  const accent=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#2175d9";
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"#0f1941"); g.addColorStop(1,accent); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.08)"; for(let i=0;i<6;i++){ ctx.beginPath(); ctx.arc(W-120-i*40, 120+i*60, 180-i*20, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle="#fff"; ctx.font="600 30px Sora, sans-serif"; ctx.fillText(String(T("cardHeader")).toUpperCase(), 60, 90);
  ctx.font="500 36px Figtree, sans-serif"; ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText(`${d.nick} is a`, 60, 190);
  ctx.font="800 120px Sora, sans-serif"; ctx.fillStyle="#fff"; ctx.fillText(d.band, 60, 310);
  ctx.font="500 36px Figtree, sans-serif"; ctx.fillStyle="rgba(255,255,255,.9)"; ctx.fillText(`${Number(d.pts).toLocaleString("en-IN")} points · ${d.ok}/${d.q} correct${d.rank>0?` · #${d.rank} of ${d.n}`:""}`, 60, 400);
  ctx.font="500 26px Figtree, sans-serif"; ctx.fillStyle="rgba(255,255,255,.7)"; const tag=String(T("cardTagline")); const mid=tag.lastIndexOf(" ", Math.floor(tag.length/2)+8); ctx.fillText(mid>0?tag.slice(0,mid):tag, 60, 500); if(mid>0) ctx.fillText(tag.slice(mid+1), 60, 540);
  if(S.cfg.logo){ const im=new Image(); im.onload=()=>{ const h=48, w=im.width*(h/im.height); ctx.fillStyle="rgba(255,255,255,.9)"; ctx.fillRect(W-w-80,H-h-50,w+20,h+20); ctx.drawImage(im, W-w-70, H-h-40, w, h); }; im.src=S.cfg.logo; }
}

/* ============================ TV ============================ */
function renderTV(){
  const st=S.state, cfg=S.cfg; document.body.classList.add("tv");
  const rid=st.roundId; const inRoundPlayers=S.players.filter(p=>p.lastRound===rid); const inRound=inRoundPlayers.length;
  const g=globalBoard(S.players,st,cfg);
  const side=`<div class="card stack"><div class="eyebrow">${esc(T("allDayTitle"))}</div><h2 style="font-size:22px">${boardTitle(g.length)}</h2>${boardHtml(g.slice(0,10))}</div>`;
  const headTv=`<div class="tvhead"><div style="font-size:26px">${brandHtml(36)}</div><div class="phase ${st.phase!=="idle"?"live":""}"><i></i>${st.phase==="idle"?"Between rounds":`Round ${st.roundNo}`}${S.online?"":" · reconnecting"}</div></div>`;
  let main;
  const prizeHtml = st.prize ? `<div class="card prize"><div class="eyebrow">${esc(T("prizeEyebrow"))}</div><div class="big">${esc(st.prize.nick)}</div><p class="muted" style="font-size:22px;margin:0">${st.prize.level?`Drawn from the ${esc(st.prize.level)} level · `:""}${esc(T("prizeBlurb"))}</p></div>` : "";
  if(st.phase==="idle"||!rid){
    main=`<div class="card stack" style="align-items:center;text-align:center"><div class="eyebrow">${esc(T("tvScan"))}</div><h1>${esc(T("joinTitle"))}</h1><div id="qrbox" class="qr" data-size="300"></div><p class="qr-url">${esc(playerUrl())}</p><p class="muted" style="font-size:20px">${esc(T("tvIdleBlurb"))}</p></div>`;
  } else if(st.phase==="lobby"){
    const secs=Math.max(0,Math.ceil(((st.lobbyEndsAt||0)-now())/1000));
    const chips=inRoundPlayers.slice(-40).map(p=>`<span class="chip">${esc(p.nick)}</span>`).join("");
    main=`<div class="card stack" style="align-items:center;text-align:center"><div class="eyebrow">Round ${st.roundNo}</div><h1>${secs>0?esc(T("tvLobbyTitle")):esc(T("tvLobbySoon"))}</h1>${secs>0?`<div class="big num" style="font-size:96px">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div>`:""}<div class="row" style="justify-content:center;gap:28px;align-items:flex-start"><div><div id="qrbox" class="qr" data-size="240"></div><p class="qr-url">${esc(playerUrl())}</p></div><div style="max-width:560px;text-align:left"><div class="pill accent" style="font-size:22px;margin-bottom:10px"><span class="num">${inRound}</span> player${inRound===1?"":"s"} ready</div><div class="chips">${chips||`<span class="muted">${esc(T("tvNoPlayers"))}</span>`}</div></div></div></div>`;
  } else {
    const q=currentQ(); const answered=q?S.players.filter(p=>p.rounds&&p.rounds[rid]&&p.rounds[rid][q.id]):[];
    if(st.phase==="question" && q){
      main=`<div class="card stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">Question ${(st.qIndex||0)+1} of ${(st.qIds||[]).length}</div><span class="pill accent num" style="font-size:18px">${answered.length} of ${inRound} answered</span></div>${timerHtml(timerFor(cfg,q))}<div class="grid2"><div class="chart">${renderChart(q.chart,true)}</div><div class="stack"><h2 style="font-size:24px">${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>`<div class="opt"><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></div>`).join("")}</div></div></div></div>`;
    } else if(st.phase==="reveal" && q){
      const counts=q.options.map((_,i)=>answered.filter(p=>p.rounds[rid][q.id].c===i).length); const mx=Math.max(1,...counts);
      main=`<div class="card stack"><div class="eyebrow">Question ${(st.qIndex||0)+1} · the answer</div><div class="grid2"><div class="stack"><div class="chart">${renderChart(q.chart,true)}</div><p style="font-size:20px;margin:0"><b>${esc(T("whyLabel"))}</b> ${esc(q.explain)}</p></div><div class="stack"><h2 style="font-size:22px">${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>`<div class="opt ${i===q.correct?"correct":""}"><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></div>`).join("")}</div><div><div class="eyebrow">${esc(T("roomVoted"))}</div>${q.options.map((o,i)=>`<div class="vote ${i===q.correct?"correct":""}"><b>${KEYS[i]}</b><div class="bar"><i style="width:${counts[i]/mx*100}%"></i></div><span class="num muted">${counts[i]}</span></div>`).join("")}</div></div></div></div>`;
    } else if(st.phase==="board"){
      const b=roundBoard(S.players,rid);
      main=`<div class="card stack"><div class="eyebrow">Round ${st.roundNo} · after question ${(st.qIndex||0)+1}</div><h1>${boardTitle(b.length)}</h1>${boardHtml(b.slice(0,10))}</div>`;
    } else if(st.phase==="ended"){
      const b=roundBoard(S.players,rid); const bands=[...(cfg.bands||[])].sort((a,c)=>a.min-c.min); const dist=bands.map(bd=>({...bd,n:0})); b.forEach(p=>{ const bd=levelOf(p,rid); const d=dist.find(x=>x.name===bd.name); if(d) d.n++; });
      main=`${prizeHtml}<div class="card stack"><div class="eyebrow">Round ${st.roundNo} · final</div><h1>${boardTitle(b.length)}</h1>${boardHtml(b.slice(0,10))}<div class="eyebrow" style="margin-top:8px">${esc(T("levelsTitle"))}</div><div class="bands">${dist.map(d=>`<div><b class="num">${d.n}</b>${esc(d.name)}<br><small>${d.min}%+</small></div>`).join("")}</div></div>`;
    } else main=`<div class="card"><p class="muted">Waiting…</p></div>`;
  }
  return `<div class="tvwrap">${headTv}<div class="tvmain"><div class="stack">${main}</div>${side}</div></div>`;
}

/* ============================ HOST ============================ */
function renderHost(){
  const st=S.state, cfg=S.cfg;
  if(!S.ready) return `<div class="wrap"><div class="card">${head("Host")}<p class="muted">Loading…</p></div></div>`;
  if(S.authError==="setup") return `<div class="wrap"><div class="card stack">${head("Host")}<h2>Not connected yet</h2><p>Paste your Supabase project URL and anon key into <code>supabase-config.js</code> first (see the setup guide).</p></div></div>`;
  if(!S.hostUser) return `<div class="wrap"><div class="card stack">${head("Host")}<h2>Host sign-in</h2><p class="muted">Use the host email and password created in Supabase → Authentication → Users. Players never see this screen.</p><form id="loginform" class="stack"><div class="field"><label class="f" for="h_email">Email</label><input id="h_email" type="email" autocomplete="username" required></div><div class="field"><label class="f" for="h_pass">Password</label><input id="h_pass" type="password" autocomplete="current-password" required></div><button class="btn" type="submit" ${S.loginBusy?"disabled":""}>Sign in</button></form><p class="muted" style="font-size:13px">Not the host? <a href="#">Go to the player page</a>.</p></div></div>`;
  const tabs=`<div class="tabs">${[["run","Run the game"],["players","Players"],["settings","Settings & questions"]].map(([k,l])=>`<button data-tab="${k}" class="${S.hostTab===k?"on":""}">${l}</button>`).join("")}</div>`;
  const topbar=`<div class="card row" style="justify-content:space-between"><div class="brand"><span class="dot"></span>Host console <span class="muted" style="font-weight:400;font-size:12px">${esc(S.hostUser.email||"")}</span></div>${tabs}<div class="row"><a class="btn small secondary" href="#tv" target="_blank" rel="noopener">Open TV screen</a><a class="btn small secondary" href="#" target="_blank" rel="noopener">Open player view</a><button class="btn small secondary" data-act="logout">Sign out</button></div></div>`;
  if(S.hostTab==="settings") return `<div class="hostlayout" style="grid-template-columns:1fr"><div class="stack">${topbar}${renderSettings()}</div></div>`;
  if(S.hostTab==="players") return `<div class="hostlayout" style="grid-template-columns:1fr"><div class="stack">${topbar}${renderPlayersTab()}</div></div>`;
  const inRound=S.players.filter(p=>p.lastRound===st.roundId).length; const q=currentQ(); const rid=st.roundId; const answered=q&&rid?S.players.filter(p=>p.rounds&&p.rounds[rid]&&p.rounds[rid][q.id]).length:0;
  const nQ=questionsForRound(cfg).length; const ph=st.phase||"idle"; let controls="";
  if(ph==="idle"||ph==="ended") controls=`<button class="btn" data-act="lobby">Open lobby for round ${(st.roundNo||0)+1}</button><p class="muted" style="font-size:13px;margin:0">Shows the QR and a ${cfg.lobbyMinutes}-minute countdown on the TV. ${nQ} questions enabled, ${cfg.timerSec}s each by default.</p>`;
  else if(ph==="lobby") controls=`<button class="btn" data-act="start">Start round ${st.roundNo} now</button><button class="btn secondary" data-act="cancel">Cancel this round</button>`;
  else if(ph==="question") controls=`${st.pausedAt?`<button class="btn" data-act="resume">Resume timer</button>`:`<button class="btn secondary" data-act="pause">Pause timer</button>`}<button class="btn secondary" data-act="extend">+${cfg.extendSec||15} s</button><button class="btn" data-act="reveal">Reveal answer now</button><p class="muted" style="font-size:13px;margin:0">Reveals automatically when the timer ends (not while paused).</p>`;
  else if(ph==="reveal") controls=`<button class="btn" data-act="board">Show leaderboard</button><button class="btn secondary" data-act="next">${(st.qIndex||0)+1<(st.qIds||[]).length?"Skip to next question":"Finish round"}</button>`;
  else if(ph==="board") controls=`<button class="btn" data-act="next">${(st.qIndex||0)+1<(st.qIds||[]).length?"Next question":"Finish round"}</button>`;
  const prizeCtl = (ph==="ended"||ph==="board"||ph==="reveal") ? `<div class="card stack"><div class="eyebrow">Prize draw</div><p class="muted" style="font-size:13px;margin:0">Picks one random player from this round and shows them on the TV at the end of the round.</p><div class="row"><select id="prizeLevel" style="max-width:220px"><option value="">Any level</option>${(cfg.bands||[]).map(b=>`<option value="${esc(b.name)}" ${S.prizeLevel===b.name?"selected":""}>${esc(b.name)} only</option>`).join("")}</select><button class="btn secondary" data-act="prize">Draw a winner</button>${st.prize?`<span class="pill good">Winner: ${esc(st.prize.nick)}</span><button class="btn small secondary" data-act="clearprize">Clear</button>`:""}</div></div>` : "";
  const live=`<div class="card stack"><div class="phase ${ph!=="idle"?"live":""}"><i></i>${ph==="idle"?"Between rounds":`Round ${st.roundNo} · ${ph}${st.pausedAt?" (paused)":""}`}${S.online?"":" · reconnecting"}</div><div class="kpi"><div><b class="num">${S.players.length}</b><span>players today</span></div><div><b class="num">${inRound}</b><span>in this round</span></div>${q&&(ph==="question"||ph==="reveal")?`<div><b class="num">${answered}</b><span>answered Q${(st.qIndex||0)+1}</span></div><div><b class="num">${remaining()}</b><span>seconds left</span></div>`:""}</div>${q&&ph!=="idle"&&ph!=="lobby"&&ph!=="ended"?`<div><div class="eyebrow">Now showing</div><b>Q${(st.qIndex||0)+1}. ${esc(q.title)}</b><p class="muted" style="margin:4px 0 0">${esc(q.prompt)}<br>Answer: <b>${KEYS[q.correct]}</b></p></div>`:""}<div class="row">${controls}</div></div>`;
  const b=rid?roundBoard(S.players,rid):[]; const g=globalBoard(S.players,st,cfg);
  const boards=`<div class="card stack"><div class="eyebrow">This round</div>${boardHtml(b.slice(0,10))}<div class="eyebrow" style="margin-top:8px">All day (${cfg.globalMode})</div>${boardHtml(g.slice(0,10))}</div>`;
  const danger=`<div class="card stack"><div class="eyebrow">Housekeeping</div><p class="muted" style="font-size:13px;margin:0">The TV and phones follow whatever you do here. Keep this tab open during a question: it triggers the reveal when the timer ends.</p><div class="row"><button class="btn small secondary" data-act="abandon" ${ph==="idle"?"disabled":""}>Abandon current round</button><button class="btn small danger" data-act="wipe">Clear all players & scores</button></div><div id="confirmbox" hidden class="notice stack"><b>Delete every player and all scores for the day?</b><div class="row"><button class="btn small danger" data-act="wipe-yes">Yes, clear everything</button><button class="btn small secondary" data-act="wipe-no">Keep them</button></div></div></div>`;
  return `<div class="hostlayout"><div class="stack" style="grid-column:1/-1">${topbar}</div><div class="stack">${live}${prizeCtl}${danger}</div><div class="stack">${boards}</div></div>`;
}
function renderPlayersTab(){
  const st=S.state; const rid=st.roundId; const list=[...S.players].sort((a,b)=>(b.joinedAt||"").localeCompare(a.joinedAt||""));
  return `<div class="card stack"><div class="row" style="justify-content:space-between"><h2>Players (${list.length})</h2><span class="muted" style="font-size:13px">Rename or remove anyone whose nickname shouldn't be on the big screen.</span></div><div class="plist">${list.map(p=>{ const sc=rid?roundScore(p,rid):{pts:0}; const editing=S.editNick===p.id; return `<div class="prow"><div>${editing?`<form class="row" data-rename="${p.id}"><input id="rn_${p.id}" value="${esc(p.nick)}" maxlength="18" style="max-width:200px"><button class="btn small" type="submit">Save</button><button class="btn small secondary" type="button" data-act="rename-cancel">Cancel</button></form>`:`<b>${esc(p.nick)}</b> <span class="muted" style="font-size:12px">${p.lastRound===rid?"in this round":"not in this round"} · ${fmt(sc.pts)} pts</span>`}</div><div class="row">${editing?"":`<button class="btn small secondary" data-act="rename" data-id="${p.id}">Rename</button><button class="btn small danger" data-act="remove" data-id="${p.id}">Remove</button>`}</div></div>`; }).join("")||`<p class="muted">Nobody has joined yet.</p>`}</div></div>`;
}
function renderSettings(){
  const cfg=S.cfg; const tx={...DEFAULT_CONFIG.texts, ...(cfg.texts||{})};
  const f=(id,label,val,type="text",extra="")=>`<div class="field"><label class="f" for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
  const bands=(cfg.bands||[]).map((b,i)=>`<div class="fgrid" style="grid-template-columns:1fr 90px 2fr auto;align-items:end">${f("band_name_"+i,"Level name",b.name)}${f("band_min_"+i,"From %",b.min,"number",'min="0" max="100"')}${f("band_blurb_"+i,"One-liner shown to the player",b.blurb||"")}<button class="btn small secondary" data-act="band-del" data-i="${i}" type="button">Remove</button></div>`).join("");
  const qs=(cfg.questions||[]).map((q,i)=>`<details class="q" id="qd_${i}"><summary><span class="pill ${q.enabled!==false?"good":""}">${q.enabled!==false?"on":"off"}</span><span>${i+1}. ${esc(q.title)}</span><span class="muted" style="font-size:12px">answer ${KEYS[q.correct]}</span></summary><div class="body">
    <div class="fgrid">${f("q_title_"+i,"Short title",q.title)}${f("q_id_"+i,"Id (unique, letters/numbers)",q.id)}${f("q_timer_"+i,"Timer override (s, blank = default)",q.timerSec||"","number")}<div class="field"><label class="f" for="q_enabled_${i}">Enabled</label><select id="q_enabled_${i}"><option value="1" ${q.enabled!==false?"selected":""}>Yes</option><option value="0" ${q.enabled===false?"selected":""}>No</option></select></div></div>
    <div class="field"><label class="f" for="q_prompt_${i}">Question</label><textarea id="q_prompt_${i}" rows="2">${esc(q.prompt)}</textarea></div>
    <div class="fgrid">${q.options.map((o,j)=>f(`q_opt_${i}_${j}`,"Option "+KEYS[j],o)).join("")}</div>
    <div class="row"><button class="btn small secondary" type="button" data-act="opt-add" data-i="${i}" ${q.options.length>=6?"disabled":""}>Add option</button><button class="btn small secondary" type="button" data-act="opt-del" data-i="${i}" ${q.options.length<=2?"disabled":""}>Remove last option</button><div class="field" style="min-width:160px"><label class="f" for="q_correct_${i}">Correct option</label><select id="q_correct_${i}">${q.options.map((_,j)=>`<option value="${j}" ${q.correct===j?"selected":""}>${KEYS[j]}</option>`).join("")}</select></div></div>
    <div class="field"><label class="f" for="q_explain_${i}">Explanation shown at the reveal</label><textarea id="q_explain_${i}" rows="2">${esc(q.explain)}</textarea></div>
    <div class="field"><label class="f" for="q_chart_${i}">Chart (JSON). Types: bar, line, scatter, pie, table, none. Keys: title, labels, values, yMin, yMax, unit, note; scatter: points [[x,y,label]], xLabel, yLabel; table: columns, rows</label><textarea id="q_chart_${i}" class="code">${esc(JSON.stringify(q.chart||{type:"none"}))}</textarea></div>
    <div class="row"><div class="chart" style="flex:1;min-width:0">${renderChart(q.chart)}</div></div>
    <div class="row"><button class="btn small secondary" type="button" data-act="q-up" data-i="${i}">Move up</button><button class="btn small secondary" type="button" data-act="q-down" data-i="${i}">Move down</button><button class="btn small danger" type="button" data-act="q-del" data-i="${i}">Delete question</button></div>
  </div></details>`).join("");
  const texts=Object.entries(DEFAULT_CONFIG.texts).map(([k,v])=>`<div class="field"><label class="f" for="t_${k}">${esc(TEXT_LABELS[k]||k)}</label><input id="t_${k}" value="${esc(tx[k])}"></div>`).join("");
  return `<form id="settingsform" class="stack">
    <div class="card stack"><h2>Game settings</h2><div class="fgrid">${f("s_title","Quiz title",cfg.title)}${f("s_timer","Seconds per question",cfg.timerSec,"number",'min="5"')}${f("s_points","Points for a correct answer",cfg.pointsCorrect,"number",'min="0"')}${f("s_bonus","Max speed bonus (0 = off)",cfg.speedBonusMax,"number",'min="0"')}${f("s_lobby","Lobby countdown (minutes)",cfg.lobbyMinutes,"number",'min="0"')}${f("s_extend","'+ seconds' button adds",cfg.extendSec||15,"number",'min="5"')}<div class="field"><label class="f" for="s_global">All-day leaderboard counts</label><select id="s_global"><option value="best" ${cfg.globalMode==="best"?"selected":""}>Best single round</option><option value="total" ${cfg.globalMode==="total"?"selected":""}>Total points across rounds</option></select></div><div class="field"><label class="f" for="s_shuffle">Question order</label><select id="s_shuffle"><option value="0" ${!cfg.shuffleQuestions?"selected":""}>As listed</option><option value="1" ${cfg.shuffleQuestions?"selected":""}>Shuffle each round</option></select></div></div>
    <div class="field"><label class="f" for="s_url">Player link encoded in the QR (leave blank to use this page's address)</label><input id="s_url" value="${esc(cfg.playerUrl||"")}" placeholder="https://yourname.github.io/data-day-quiz/"></div></div>
    <div class="card stack"><h2>Look</h2><div class="fgrid">${f("s_accent","Accent colour (hex, e.g. #2175D9; blank = default blue)",cfg.accent||"")}<div class="field"><label class="f" for="s_logo">Logo (PNG/SVG, under 200 KB)</label><input id="s_logo" type="file" accept="image/*"></div><div class="field"><label class="f">Current logo</label><div class="row">${cfg.logo?`<img src="${cfg.logo}" alt="logo" style="height:36px"><button class="btn small secondary" type="button" data-act="logo-clear">Remove logo</button>`:`<span class="muted">none (a blue dot is shown)</span>`}</div></div></div></div>
    <div class="card stack"><h2>Levels (bands)</h2><p class="muted" style="margin:0;font-size:13px">Based on % of the maximum points in a round. Lowest level first; every player lands in one, so make the first level's name encouraging.</p>${bands}<div class="row"><button class="btn small secondary" data-act="band-add" type="button">Add level</button></div></div>
    <div class="card stack"><h2>Questions (${(cfg.questions||[]).length})</h2><p class="muted" style="margin:0;font-size:13px">Edit anything, then save. Save between rounds, not during one.</p>${qs}<div class="row"><button class="btn small secondary" data-act="q-add" type="button">Add question</button><button class="btn small secondary" data-act="restore" type="button">Restore the default 10 questions</button></div></div>
    <div class="card stack"><h2>Texts</h2><p class="muted" style="margin:0;font-size:13px">Wording shown on phones and the TV. {nick}, {points} and {bonus} are filled in automatically where they appear.</p><div class="fgrid">${texts}</div></div>
    <div class="card stack"><h2>Backup</h2><div class="field"><label class="f" for="s_json">Full configuration as JSON (copy to keep a backup; paste and load to restore)</label><textarea id="s_json" class="code" rows="6">${esc(JSON.stringify(cfg,null,1))}</textarea></div><div class="row"><button class="btn small secondary" data-act="import" type="button">Load from the JSON above</button></div></div>
    <div class="card row" style="justify-content:space-between"><span class="muted">Changes apply to the next round.</span><button class="btn" type="submit">Save settings</button></div>
  </form>`;
}
function readSettingsForm(){
  const cfg=clean(S.cfg); const v=id=>{ const el=document.getElementById(id); return el?el.value:undefined; };
  cfg.title=v("s_title")||cfg.title; cfg.timerSec=Math.max(5,+v("s_timer")||45); cfg.pointsCorrect=Math.max(0,+v("s_points")||0); cfg.speedBonusMax=Math.max(0,+v("s_bonus")||0); cfg.lobbyMinutes=Math.max(0,+v("s_lobby")||0); cfg.extendSec=Math.max(5,+v("s_extend")||15); cfg.globalMode=v("s_global")||"best"; cfg.shuffleQuestions=v("s_shuffle")==="1"; cfg.playerUrl=(v("s_url")||"").trim(); cfg.accent=(v("s_accent")||"").trim();
  cfg.bands=(cfg.bands||[]).map((b,i)=>({name:v("band_name_"+i)||b.name, min:+v("band_min_"+i)||0, blurb:v("band_blurb_"+i)||""}));
  cfg.questions=(cfg.questions||[]).map((q,i)=>{ let chart=q.chart; try{ chart=JSON.parse(v("q_chart_"+i)||"{}"); }catch(e){ toast(`Question ${i+1}: chart JSON is not valid, kept the old chart`); } const t=v("q_timer_"+i); const opts=q.options.map((o,j)=>v(`q_opt_${i}_${j}`)??o); return {...q, title:v("q_title_"+i)||q.title, id:(v("q_id_"+i)||q.id).replace(/[^A-Za-z0-9_-]/g,""), timerSec:t?+t:undefined, enabled:v("q_enabled_"+i)!=="0", prompt:v("q_prompt_"+i)??q.prompt, options:opts, correct:Math.min(opts.length-1, +v("q_correct_"+i)||0), explain:v("q_explain_"+i)??q.explain, chart}; });
  const ids=new Set(); for(const q of cfg.questions){ if(!q.id||ids.has(q.id)){ q.id="q"+Math.random().toString(36).slice(2,7); } ids.add(q.id); }
  cfg.texts={}; for(const k of Object.keys(DEFAULT_CONFIG.texts)){ const val=v("t_"+k); cfg.texts[k]=(val==null||val==="")?DEFAULT_CONFIG.texts[k]:val; }
  return cfg;
}
async function saveConfig(cfg){ const {error}=await S.sb.rpc("host_save_config",{p_data:clean(cfg)}); if(error) toast("Could not save: "+error.message); else { S.cfg=cfg; applyBrand(); toast("Settings saved"); } }
function hostAutoAdvance(){ if(S.route!=="host"||!S.hostUser||!S.sb) return; const st=S.state; if(st.phase==="question" && !st.pausedAt && now()>(st.qEndsAt||0)+1500){ const key=st.roundId+"/"+st.qIndex+"/"+st.qEndsAt; if(S.lastAutoReveal===key) return; S.lastAutoReveal=key; hostRpc("reveal"); } }
async function hostAction(act, el){
  const st=S.state, cfg=S.cfg;
  if(act==="lobby"){ await hostRpc("lobby"); S.lastAutoReveal=null; }
  else if(act==="start"){ const qs=questionsForRound(cfg); if(!qs.length) return toast("No questions enabled"); await hostRpc("start",{qIds:qs.map(q=>q.id)}); }
  else if(["cancel","reveal","board","next","pause","resume","abandon","clearprize"].includes(act)){ await hostRpc(act); if(act==="abandon") toast("Round abandoned (its answers no longer count)"); }
  else if(act==="extend"){ await hostRpc("extend",{seconds:cfg.extendSec||15}); }
  else if(act==="prize"){ const lvl=($("#prizeLevel")||{}).value||""; S.prizeLevel=lvl; const rid=st.roundId; let ids=null; if(lvl){ ids=S.players.filter(p=>p.rounds&&p.rounds[rid]&&levelOf(p,rid).name===lvl).map(p=>p.id); if(!ids.length) return toast("Nobody in that level this round"); } await hostRpc("prize", lvl?{level:lvl, ids}:{}); }
  else if(act==="wipe"){ $("#confirmbox").hidden=false; }
  else if(act==="wipe-no"){ $("#confirmbox").hidden=true; }
  else if(act==="wipe-yes"){ $("#confirmbox").hidden=true; await hostRpc("wipe"); loadPlayers(); toast("Cleared"); }
  else if(act==="logout"){ await S.sb.auth.signOut(); S.hostUser=null; lastHtml=""; render(); }
  else if(act==="rename"){ S.editNick=el.dataset.id; lastHtml=""; render(); }
  else if(act==="rename-cancel"){ S.editNick=null; lastHtml=""; render(); }
  else if(act==="remove"){ const {error}=await S.sb.rpc("host_player",{p_id:el.dataset.id, p_action:"remove"}); if(error) toast(error.message); else { toast("Removed"); loadPlayers(); } }
  // settings actions
  else if(act==="band-add"){ const c=readSettingsForm(); c.bands.push({name:"New level",min:0,blurb:""}); S.cfg=c; lastHtml=""; render(); }
  else if(act==="band-del"){ const c=readSettingsForm(); c.bands.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  else if(act==="opt-add"){ const c=readSettingsForm(); const q=c.questions[+el.dataset.i]; if(q.options.length<6) q.options.push(""); S.cfg=c; lastHtml=""; render(); openQ(+el.dataset.i); }
  else if(act==="opt-del"){ const c=readSettingsForm(); const q=c.questions[+el.dataset.i]; if(q.options.length>2){ q.options.pop(); q.correct=Math.min(q.correct,q.options.length-1); } S.cfg=c; lastHtml=""; render(); openQ(+el.dataset.i); }
  else if(act==="q-add"){ const c=readSettingsForm(); c.questions.push({id:"q"+Math.random().toString(36).slice(2,7), enabled:true, title:"New question", prompt:"", chart:{type:"none"}, options:["","","",""], correct:0, explain:""}); S.cfg=c; lastHtml=""; render(); openQ(c.questions.length-1, true); }
  else if(act==="q-del"){ const c=readSettingsForm(); c.questions.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  else if(act==="q-up"||act==="q-down"){ const c=readSettingsForm(); const i=+el.dataset.i, j=act==="q-up"?i-1:i+1; if(j<0||j>=c.questions.length) return; [c.questions[i],c.questions[j]]=[c.questions[j],c.questions[i]]; S.cfg=c; lastHtml=""; render(); }
  else if(act==="restore"){ const c=readSettingsForm(); c.questions=clean(DEFAULT_CONFIG.questions); S.cfg=c; lastHtml=""; render(); toast("Default questions loaded. Save to keep them."); }
  else if(act==="import"){ try{ const c={...DEFAULT_CONFIG, ...JSON.parse($("#s_json").value)}; S.cfg=c; lastHtml=""; render(); toast("Loaded. Save to keep it."); }catch(e){ toast("That JSON didn't parse"); } }
  else if(act==="logo-clear"){ const c=readSettingsForm(); c.logo=""; S.cfg=c; lastHtml=""; render(); toast("Logo removed. Save to keep it."); }
}
function openQ(i, scroll){ setTimeout(()=>{ const d=document.getElementById("qd_"+i); if(d){ d.open=true; if(scroll) d.scrollIntoView({behavior:"smooth"}); } },30); }

/* ============================ EVENTS ============================ */
app.addEventListener("click", async e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ if(S.hostTab==="settings"&&tab.dataset.tab!=="settings"){ S.cfg=readSettingsForm(); } S.hostTab=tab.dataset.tab; lastHtml=""; render(); return; }
  const act=e.target.closest("[data-act]"); if(act){ e.preventDefault(); await hostAction(act.dataset.act, act); return; }
  const opt=e.target.closest(".opt[data-i]"); if(opt && S.route!=="tv" && S.route!=="host"){ await answer(+opt.dataset.i); }
});
app.addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="joinform"){ const nick=$("#nick").value.trim().slice(0,18); if(!nick) return; S.nick=nick; ls.set("dd_nick",nick); S.answerBusy=true; lastHtml=""; render(); const {error}=await S.sb.rpc("join_game",{p_nick:nick}); S.answerBusy=false; if(error){ toast("Could not join: "+error.message); } else { S.joined=true; ls.set("dd_joined","1"); S.lastRoundSeen=S.state.roundId||null; toast("You're in!"); await loadPlayers(); } lastHtml=""; render(); }
  if(e.target.id==="loginform"){ const email=$("#h_email").value.trim(), password=$("#h_pass").value; if(!email||!password) return toast("Enter the host email and password"); S.loginBusy=true; lastHtml=""; render(); const {error}=await S.sb.auth.signInWithPassword({email, password}); if(error) toast(/invalid/i.test(error.message)?"Email or password not recognised":error.message); S.loginBusy=false; lastHtml=""; render(); }
  if(e.target.id==="settingsform"){ const c=readSettingsForm(); await saveConfig(c); lastHtml=""; render(); }
  const rn=e.target.dataset.rename; if(rn){ const val=document.getElementById("rn_"+rn).value.trim().slice(0,18); if(!val) return; const {error}=await S.sb.rpc("host_player",{p_id:rn, p_action:"rename", p_nick:val}); if(error) toast(error.message); S.editNick=null; await loadPlayers(); lastHtml=""; render(); }
});
app.addEventListener("input", e=>{ if(S.route==="host"&&S.hostTab==="settings"&&e.target.id.startsWith("q_chart_")){ try{ const spec=JSON.parse(e.target.value); const box=e.target.closest(".body").querySelector(".chart"); if(box) box.innerHTML=renderChart(spec); }catch(err){} } });
app.addEventListener("change", e=>{ if(e.target.id==="s_logo"){ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>200*1024) return toast("Logo must be under 200 KB"); const r=new FileReader(); r.onload=()=>{ const c=readSettingsForm(); c.logo=r.result; S.cfg=c; lastHtml=""; render(); toast("Logo loaded. Save to keep it."); }; r.readAsDataURL(f); } });
async function answer(i){
  const st=S.state, q=currentQ(); if(!q||st.phase!=="question"||S.answerBusy||st.pausedAt) return;
  const me=S.players.find(p=>p.id===S.uid); if(!me) return; if(me.rounds&&me.rounds[st.roundId]&&me.rounds[st.roundId][q.id]) return;
  if(now()>(st.qEndsAt||0)+1500) return toast(T("timesUp"));
  S.answerBusy=true; lastHtml=""; render();
  const {data,error}=await S.sb.rpc("submit_answer",{p_choice:i});
  if(error){ toast(error.message); } else if(data){ me.rounds=me.rounds||{}; me.rounds[st.roundId]=me.rounds[st.roundId]||{}; me.rounds[st.roundId][q.id]={c:i, ms:data.ms, ok:data.ok, pts:data.pts}; }
  S.answerBusy=false; lastHtml=""; render();
}
// when a new lobby opens while a joined phone is open, re-join silently so the player counts for that round
setInterval(async()=>{ if(S.route||!S.sb||!S.uid||!S.joined) return; const rid=S.state.roundId; if(rid&&rid!==S.lastRoundSeen){ S.lastRoundSeen=rid; const me=S.players.find(p=>p.id===S.uid); if(me&&me.lastRound!==rid){ await S.sb.rpc("join_game",{p_nick:me.nick}); } } },1500);
boot();
</script>
