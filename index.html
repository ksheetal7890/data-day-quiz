<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Data IQ Showdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app, three routes (player phone / TV / host). Player & TV are centred columns; host is a two-pane console. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9eef7; --fg:#0f1941; --muted:#5b6480; --line:#d5dceb;
  --accent:#2175d9; --accent-ink:#ffffff; --navy:#0f1941;
  --good:#1d8a4e; --bad:#c43d3d; --warn:#c7811a;
  --c1:#2175d9; --c2:#f0a63a; --c3:#5b9e6e; --c4:#9a6bd6; --c5:#d96a9b; --c6:#49a7b4; --c7:#9aa3b8;
  --display:'Sora',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  --radius:14px; --shadow:0 8px 28px rgba(15,25,65,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1230; --surface:#141d3f; --surface2:#1c2750; --fg:#eef2fb; --muted:#9aa6c8; --line:#2b3764;
  --accent:#4f93ea; --accent-ink:#06102a; --navy:#eef2fb; --good:#4fbf7e; --bad:#ef6e6e; --warn:#e9a84a;
  --c1:#4f93ea; --c2:#f3b65a; --c3:#6fb886; --c4:#b08ae6; --c5:#e68ab5; --c6:#63bec9; --c7:#7f88a3;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1230; --surface:#141d3f; --surface2:#1c2750; --fg:#eef2fb; --muted:#9aa6c8; --line:#2b3764;
  --accent:#4f93ea; --accent-ink:#06102a; --navy:#eef2fb; --good:#4fbf7e; --bad:#ef6e6e; --warn:#e9a84a;
  --c1:#4f93ea; --c2:#f3b65a; --c3:#6fb886; --c4:#b08ae6; --c5:#e68ab5; --c6:#63bec9; --c7:#7f88a3;
  --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px;padding-inline:16px;min-height:100%}
.tvwrap{max-width:1400px;margin:0 auto;padding-block:20px;padding-inline:24px;min-height:100%;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--display);font-size:15px}
.btn.secondary{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.accent{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.timer{font-family:var(--display);font-weight:800;font-size:28px;min-width:64px;text-align:center;border-radius:12px;background:var(--surface2);padding:4px 10px}
.timer.low{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.options{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px 14px;color:var(--fg);width:100%}
.opt .key{font-family:var(--display);font-weight:800;width:28px;height:28px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.chosen{border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface2))}
.opt:disabled{cursor:default}
.chart{background:var(--surface2);border-radius:12px;padding:10px;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;font-family:var(--body)}
.chart table{border-collapse:collapse;width:100%;font-size:14px}
.chart th,.chart td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.chart th:first-child,.chart td:first-child{text-align:left}
.chart th{font-family:var(--display);font-size:12px;color:var(--muted)}
.lb{display:flex;flex-direction:column;gap:6px}
.lb .r{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.lb .r.me{outline:2px solid var(--accent)}
.lb .r .rank{font-family:var(--display);font-weight:800;color:var(--muted)}
.lb .r .pts{font-family:var(--display);font-weight:800}
.lb .r:nth-child(1) .rank{color:var(--c2)}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi>div{background:var(--surface2);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:24px}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.vote{display:grid;grid-template-columns:28px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.vote .bar{height:14px}
.vote.correct .bar>i{background:var(--good)}
.traits{display:grid;gap:8px}.trait{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:14px}.trait .bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}.trait .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}.trait .tv_{text-align:right;color:var(--muted)}.traits.big .trait{font-size:20px;grid-template-columns:260px 1fr 80px}.traits.big .bar{height:16px}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.bands>div{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.bands b{display:block;font-family:var(--display);font-size:26px}
.bands small{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--surface2);border:0;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--fg)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
details.q{background:var(--surface2);border-radius:12px;padding:10px 14px}
details.q summary{cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.q .body{display:flex;flex-direction:column;gap:10px;padding-top:10px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:90px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);z-index:9}
.tvhead{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.tvmain{display:grid;grid-template-columns:2fr 1fr;gap:18px;flex:1;min-height:0}
@media (max-width:900px){.tvmain{grid-template-columns:1fr}}
.tv .card{padding:24px}
.tv h1{font-size:40px}
.tv h2{font-size:28px}
.tv .opt{font-size:20px;padding:14px 18px}
.tv .lb .r{font-size:20px;padding:10px 16px}
.tv .timer{font-size:40px}
.qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;width:fit-content;margin:0 auto}
.qr img,.qr canvas{display:block}
.qr-url{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin-top:8px}
.resultcard{width:100%;max-width:520px;border-radius:12px;display:block;margin:0 auto}
.recap{display:flex;flex-direction:column;gap:8px}
.recap .i{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface2);border-radius:10px}
.recap .i p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.hostlayout{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1300px;margin:0 auto;padding-block:16px;padding-inline:16px}
@media (max-width:900px){.hostlayout{grid-template-columns:1fr}}
.phase{display:inline-flex;gap:8px;align-items:center;font-family:var(--display);font-weight:700}
.phase i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.phase.live i{background:var(--good)}
.notice{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-left:4px solid var(--warn);padding:12px 14px;border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.offline{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--warn);color:#1a1200;text-align:center;font-weight:600;padding:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border-radius:999px;padding:6px 14px;font-weight:600;animation:pop .35s ease-out}
.tv .chip{font-size:20px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.prize{border:3px solid var(--c2);text-align:center}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:8px 12px}
.brand img{display:block}
.hostlayout{font-size:17px}
.hostlayout .btn{font-size:16px}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

    {"id": "f02", "enabled": true, "title": "94% are happy", "prompt": "A manager looks at this survey dashboard and says: \"94% of our employees are happy with our tools, so bad technology isn't causing our high turnover.\" Why is this conclusion incorrect?", "options": ["Surveys need a 100% response rate to be valid", "The survey ignores the 450 ex-employees (26% of the workforce) who already quit and may have felt very differently", "Management usually alters survey results before publishing", "Employees rarely tell the truth on digital surveys"], "correct": 1, "explain": "Survivorship bias: you only asked the people who stayed. The ones most likely to be unhappy with the tools are the ones who left.", "chart": {"type": "svg", "svg": "<svg viewBox=\"0 0 560 220\" role=\"img\" aria-label=\"Survey dashboard\"><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--fg)\">Tools satisfaction survey · dashboard</text><rect x=\"16\" y=\"40\" width=\"258\" height=\"72\" rx=\"10\" fill=\"var(--surface2)\" stroke=\"var(--line)\"/><text x=\"30\" y=\"60\" font-size=\"11\" fill=\"var(--muted)\">Employees surveyed</text><text x=\"30\" y=\"90\" font-size=\"26\" font-weight=\"700\" fill=\"var(--c1)\">1,280</text><text x=\"30\" y=\"104\" font-size=\"10\" fill=\"var(--muted)\">current employees</text><rect x=\"286\" y=\"40\" width=\"258\" height=\"72\" rx=\"10\" fill=\"var(--surface2)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"60\" font-size=\"11\" fill=\"var(--muted)\">Response rate</text><text x=\"300\" y=\"90\" font-size=\"26\" font-weight=\"700\" fill=\"var(--c1)\">100%</text><text x=\"300\" y=\"104\" font-size=\"10\" fill=\"var(--muted)\">of current staff</text><rect x=\"16\" y=\"125\" width=\"258\" height=\"72\" rx=\"10\" fill=\"var(--surface2)\" stroke=\"var(--line)\"/><text x=\"30\" y=\"145\" font-size=\"11\" fill=\"var(--muted)\">Happy with our tools</text><text x=\"30\" y=\"175\" font-size=\"26\" font-weight=\"700\" fill=\"v const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS = ["A","B","C","D","E","F"];
const fmt = n => (Math.round(n)).toLocaleString("en-IN");
let toastT; function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const ls = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };

function traitsOf(cfg){ return (cfg.traits||[]).filter(t=>t&&t.id); }
function traitPts(cfg, q){ const t=traitsOf(cfg).find(t=>t.id===(q&&q.trait)); return t?(+t.pts||0):(+cfg.pointsCorrect||0); }
function roundScore(p, rid){ const cfg=S.cfg; const meta=(typeof roundsMeta==="function"?roundsMeta():{})[rid]||{}; const r=(p.rounds||{})[rid]||{}; let pts=0, ms=0, ok=0, speed=0; const traits={}; for(const t of traitsOf(cfg)) traits[t.id]={pts:0,max:0,n:0,ok:0};
  for(const id of (meta.qIds||[])){ const q=qById(cfg,id); if(!q) continue; const tid=q.trait; if(tid&&traits[tid]){ traits[tid].max+=traitPts(cfg,q); traits[tid].n++; } }
  for(const [id,a] of Object.entries(r)){ const q=qById(cfg,id); const tp=a.tp!=null?a.tp:(a.ok?traitPts(cfg,q):0); const sp=a.sp!=null?a.sp:Math.max(0,(a.pts||0)-tp); pts+=a.pts!=null?a.pts:tp+sp; ms+=a.ms||0; speed+=sp; if(a.ok) ok++; const tid=a.tr||(q&&q.trait); if(tid&&traits[tid]){ traits[tid].pts+=tp; if(a.ok) traits[tid].ok++; } }
  const max=meta.maxPts||0; const score=max?Math.round(100*pts/max):0; return {pts, ms, ok, speed, score, max, traits, n:Object.keys(r).length}; }
function roundBoard(players, rid){ return players.filter(p=>p.rounds&&p.rounds[rid]).map(p=>({...p, ...roundScore(p,rid)})).sort((a,b)=>b.score-a.score||b.pts-a.pts||a.ms-b.ms); }
function globalBoard(players, roundsMeta, cfg){ const rounds=Object.keys(roundsMeta||{}).filter(r=>roundsMeta[r]&&roundsMeta[r].endedAt); return players.map(p=>{ let total=0,best=-1,bestMs=0,played=0,ms=0; for(const rid of rounds){ if(p.rounds&&p.rounds[rid]){ const s=roundScore(p,rid); total+=s.score; ms+=s.ms; played++; if(s.score>best||(s.score===best&&s.ms<bestMs)){ best=s.score; bestMs=s.ms; } } } return {...p, score: cfg.globalMode==="best"?Math.max(best,0):total, played, ms: cfg.globalMode==="best"?bestMs:ms}; }).filter(p=>p.played>0).sort((a,b)=>b.score-a.score||a.ms-b.ms); }
function boardTitle(n, max=10){ return n<=max ? (n===1?"The only player so far":`All ${n} players`) : `Top ${max} of ${n} players`; }
function setsOf(cfg){ const st=new Set((cfg.questions||[]).filter(q=>q.enabled!==false).map(q=>+q.set||1)); return [...st].sort((a,b)=>a-b).length?[...st].sort((a,b)=>a-b):[1]; }
function setForRound(cfg, roundNo){ const sets=setsOf(cfg); const ch=S.setChoice; if(ch&&ch!=="auto"&&sets.includes(+ch)) return +ch; return sets[((roundNo||1)-1)%sets.length]; }
function questionsForRound(cfg, setNo){ let qs=(cfg.questions||[]).filter(q=>q.enabled!==false&&(setNo==null||(+q.set||1)===+setNo)); const n=+cfg.questionsPerRound||0; if(cfg.shuffleQuestions||(n&&n<qs.length)){ qs=[...qs]; for(let i=qs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [qs[i],qs[j]]=[qs[j],qs[i]]; } } if(n&&n<qs.length) qs=qs.slice(0,n); return qs; }
function qById(cfg,id){ return (cfg.questions||[]).find(q=>q.id===id); }
function timerFor(cfg,q){ return Number(q&&q.timerSec)||Number(cfg.timerSec)||45; }

/* ============================ CHART RENDERER (inline SVG) ============================ */
function renderChart(spec, tv=false){
  if(!spec||spec.type==="none") return "";
  const W=560, H=tv?300:260, pad={l:46,r:16,t:30,b:40};
  const ink="var(--fg)", mut="var(--muted)", grid="var(--line)";
  const t = spec.title ? `<text x="${W/2}" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="${ink}" font-family="Sora,sans-serif">${esc(spec.title)}</text>` : "";
  const note = spec.note ? `<p class="muted" style="font-size:13px;margin:8px 4px 0">${esc(spec.note)}</p>` : "";
  const nice = (lo,hi)=>{ const span=(hi-lo)||1; const raw=span/5; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/mag; const step=(n>=5?10:n>=2?5:n>=1?2:1)*mag/ (n>=5?1:1); const ticks=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9 && ticks.length<12; v+=step) ticks.push(+v.toFixed(6)); return ticks; };
  if(spec.type==="bar"||spec.type==="line"){
    const vals=spec.values, labels=spec.labels; const lo = spec.yMin!=null?spec.yMin:Math.min(0,...vals); const hi = spec.yMax!=null?spec.yMax:Math.max(...vals)*1.12;
    const x = i => pad.l + (W-pad.l-pad.r)*(spec.type==="bar"? (i+0.5)/vals.length : (vals.length===1?0.5:i/(vals.length-1)));
    const y = v => pad.t + (H-pad.t-pad.b)*(1-(v-lo)/(hi-lo));
    let g=""; for(const tv_ of nice(lo,hi)){ if(tv_<lo||tv_>hi) continue; g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(tv_)}" y2="${y(tv_)}" stroke="${grid}" stroke-width="1"/><text x="${pad.l-6}" y="${y(tv_)+4}" text-anchor="end" font-size="11" fill="${mut}">${tv_}${spec.unit||""}</text>`; }
    let m=""; if(spec.type==="bar"){ const bw=Math.min(56,(W-pad.l-pad.r)/vals.length*0.62); vals.forEach((v,i)=>{ const top=y(Math.max(v,lo)), base=y(lo); m+=`<rect x="${x(i)-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,base-top)}" rx="4" fill="var(--c1)"/>`; }); }
    else { const d=vals.map((v,i)=>`${i?"L":"M"}${x(i)} ${y(v)}`).join(" "); m+=`<path d="${d}" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round"/>`; vals.forEach((v,i)=>{ m+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--c1)" stroke="var(--surface2)" stroke-width="2"/>`; }); }
    const xl = labels.map((l,i)=>`<text x="${x(i)}" y="${H-pad.b+16}" text-anchor="middle" font-size="11" fill="${mut}">${esc(l)}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${g}<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(lo)}" y2="${y(lo)}" stroke="${mut}" stroke-width="1"/>${m}${xl}</svg>${note}`;
  }
  if(spec.type==="scatter"){
    const pts=spec.points; const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const xlo=0, xhi=Math.max(...xs)*1.15, ylo=0, yhi=Math.max(...ys)*1.15;
    const x=v=>pad.l+(W-pad.l-pad.r)*(v-xlo)/(xhi-xlo), y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-ylo)/(yhi-ylo));
    let g=""; for(const tv_ of nice(ylo,yhi)){ if(tv_>yhi) continue; g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(tv_)}" y2="${y(tv_)}" stroke="${grid}"/><text x="${pad.l-6}" y="${y(tv_)+4}" text-anchor="end" font-size="11" fill="${mut}">${tv_}</text>`; }
    for(const tv_ of nice(xlo,xhi)){ if(tv_>xhi) continue; g+=`<text x="${x(tv_)}" y="${H-pad.b+16}" text-anchor="middle" font-size="11" fill="${mut}">${tv_}</text>`; }
    const m=pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="7" fill="var(--c1)" stroke="var(--surface2)" stroke-width="2"/>${p[2]?`<text x="${x(p[0])+10}" y="${y(p[1])-8}" font-size="11" fill="${mut}">${esc(p[2])}</text>`:""}`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${g}<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(ylo)}" y2="${y(ylo)}" stroke="${mut}"/>${m}<text x="${W/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="${mut}">${esc(spec.xLabel||"")}</text><text transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="${mut}">${esc(spec.yLabel||"")}</text></svg>${note}`;
  }
  if(spec.type==="pie"){
    const total=spec.values.reduce((a,b)=>a+b,0); const cx=190, cy=H/2+10, r=Math.min(cx-20, (H-pad.t)/2-16); let a=-Math.PI/2, m="", leg="";
    const cols=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)"];
    spec.values.forEach((v,i)=>{ const b=a+2*Math.PI*v/total; const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(b), y2=cy+r*Math.sin(b); const big=(b-a)>Math.PI?1:0; m+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} Z" fill="${cols[i%cols.length]}" stroke="var(--surface2)" stroke-width="2"/>`; a=b; const lx=360+(i%2)*100, ly=pad.t+12+Math.floor(i/2)*18; leg+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" rx="2" fill="${cols[i%cols.length]}"/><text x="${lx+14}" y="${ly}" font-size="11" fill="${mut}">${esc(spec.labels[i])}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"chart")}">${t}${m}${leg}</svg>${note}`;
  }
  if(spec.type==="svg"){ return `<div class="rawsvg">${spec.svg||""}</div>${note}`; }
  if(spec.type==="table"){
    return `<div style="overflow-x:auto">${spec.title?`<div class="eyebrow" style="margin:2px 4px 8px">${esc(spec.title)}</div>`:""}<table><thead><tr>${spec.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${spec.rows.map(r=>`<tr>${r.map(c=>`<td class="num">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${note}`;
  }
  return "";
}

const TEXT_LABELS = { joinEyebrow:"Join screen: small label", joinTitle:"Join screen: headline (also on the TV)", joinIntro:"Join screen: intro text", nickLabel:"Nickname field label", nickPlaceholder:"Nickname placeholder", joinButton:"Join button", inTitle:"After joining: title", waitingIdle:"Waiting between rounds", lobbyTitle:"Lobby: title", lobbyRules:"Lobby: scoring line", answerSent:"After answering (can still change)", timesUp:"Time's up", paused:"Timer paused", correct:"Reveal: correct label", wrong:"Reveal: wrong label", noAnswer:"Reveal: no answer label", whyLabel:"Explanation label", scoreEyebrow:"End of round: label above the score", traitsTitle:"End of round: profile title", tvTraitsTitle:"TV: trait averages title", recapTitle:"End of round: recap title", cardHint:"Result card hint", cardHeader:"Result card: header line", roundBoardTitle:"Round leaderboard title ({no} = round number)", dayBoardTitle:"Day leaderboard title", roomVoted:"TV: vote bars title", tvScan:"TV: scan label", tvIdleBlurb:"TV: blurb between rounds", tvLobbyTitle:"TV: lobby title (countdown)", tvLobbySoon:"TV: lobby title (countdown over)", tvNoPlayers:"TV: lobby, nobody joined yet", prizeEyebrow:"Prize draw: label", prizeBlurb:"Prize draw: line under the winner", prizeYou:"Phone: you won", prizeYouBlurb:"Phone: you won, instructions", playedTitle:"Phone: already played title", playedBlurb:"Phone: already played text" };

/* ============================ APP STATE ============================ */
const qsRoom=()=>{ try{ return new URLSearchParams(location.search).get("room")||""; }catch(e){ return ""; } };
const S = { sb:null, uid:null, hostUser:null, isHost:null, hosts:[], authError:null, offset:0, cfg:DEFAULT_CONFIG, cfgLoaded:false, cfgExists:false,
  rooms:{}, state:{phase:"idle",rounds:{}}, players:[], ready:false, online:true, route:(location.hash||"").replace("#",""), room: qsRoom()||"A",
  nick: ls.get("dd_nick")||"", joined: ls.get("dd_joined")==="1", answerBusy:false, hostTab:"run", tick:0, lastAutoReveal:null,
  loginBusy:false, editNick:null, setChoice: ls.get("dd_set")||"auto", lastRoundSeen:null, playedBlock:false, signupMode:false };
const app=$("#app");
const now=()=>Date.now()+(S.offset||0);
const clean=o=>JSON.parse(JSON.stringify(o));
window.addEventListener("hashchange",()=>{ S.route=(location.hash||"").replace("#",""); lastHtml=""; render(); });

function roomName(id){ const r=(S.cfg.rooms||[]).find(x=>x.id===id); return r?r.name:("Room "+id); }
function roundsMeta(){ const all={}; for(const st of Object.values(S.rooms)){ Object.assign(all, st.rounds||{}); } return all; }
function applyBrand(){ const a=(S.cfg.accent||"").trim(); if(/^#[0-9a-fA-F]{6}$/.test(a)) document.documentElement.style.setProperty("--accent",a); else document.documentElement.style.removeProperty("--accent"); }
function setRoomState(){ S.state = S.rooms[S.room] || {phase:"idle", rounds:{}, qIds:[]}; }

async function boot(){
  render();
  if(typeof SUPABASE_CONFIG==="undefined" || !SUPABASE_CONFIG.url || SUPABASE_CONFIG.url.includes("PASTE")){ S.authError="setup"; S.ready=true; render(); return; }
  const sb=supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, { auth:{ persistSession:true, autoRefreshToken:true } });
  S.sb=sb;
  try{ const t0=Date.now(); const {data,error}=await sb.rpc("server_time"); if(!error&&data){ const rtt=Date.now()-t0; S.offset=Number(data)-(t0+rtt/2); } }catch(e){}
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session&&session.user; if(u){ S.uid=u.id; S.hostUser=u.is_anonymous?null:u; S.authError=null; if(S.hostUser) checkHost(); } else { S.uid=null; S.hostUser=null; S.isHost=null; } S.ready=true; lastHtml=""; render(); maybeSeed(); });
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ if(S.route!=="host"){ const {error}=await sb.auth.signInAnonymously(); if(error){ S.authError=error.message; S.ready=true; render(); } } else { S.ready=true; render(); } }
  await Promise.all([loadConfig(), loadRooms(), loadPlayers()]);
  S.ready=true; lastHtml=""; render();
  sb.channel("quiz")
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},()=>loadConfig())
    .on("postgres_changes",{event:"*",schema:"public",table:"rooms"},()=>loadRooms())
    .on("postgres_changes",{event:"*",schema:"public",table:"players"},()=>loadPlayers())
    .subscribe(status=>{ const ok=status==="SUBSCRIBED"; if(ok!==S.online){ S.online=ok; lastHtml=""; render(); } if(ok){ loadRooms(); loadPlayers(); } });
  setInterval(()=>{ S.tick++; if(S.state.phase==="question"||S.state.phase==="lobby") render(true); hostAutoAdvance(); },500);
  setInterval(()=>{ if(!S.online || S.state.phase==="question"){ loadRooms(); } if(!S.online) loadPlayers(); },4000);
}
async function checkHost(){ try{ const {data}=await S.sb.rpc("host_emails_list"); S.hosts=Array.isArray(data)?data:[]; S.isHost=S.hosts.length>0; }catch(e){ S.isHost=false; } lastHtml=""; render(); maybeSeed(); }
async function loadConfig(){ const {data,error}=await S.sb.from("config").select("data").eq("id",1).maybeSingle(); if(error){ S.authError=error.message; render(); return; } S.cfgLoaded=true; S.cfgExists=!!data; if(data){ S.cfg={...DEFAULT_CONFIG, ...data.data}; S.cfg.texts={...DEFAULT_CONFIG.texts, ...(data.data.texts||{})}; if(!Array.isArray(S.cfg.rooms)||!S.cfg.rooms.length) S.cfg.rooms=clean(DEFAULT_CONFIG.rooms); } applyBrand(); render(); maybeSeed(); }
async function loadRooms(){ const {data}=await S.sb.from("rooms").select("room,data"); if(data){ const m={}; for(const r of data){ m[r.room]={rounds:{}, qIds:[], ...r.data}; } S.rooms=m; setRoomState(); render(); } }
async function loadPlayers(){ const {data}=await S.sb.from("players").select("id,nick,joined_at,last_round,room,rounds"); if(data){ S.players=data.map(p=>({id:p.id, nick:p.nick, joinedAt:p.joined_at, lastRound:p.last_round, room:p.room, rounds:p.rounds||{}})); render(); } }
let seeded=false;
async function maybeSeed(){ if(seeded||!S.isHost||!S.cfgLoaded||S.cfgExists||!S.sb) return; seeded=true; const c=clean({...DEFAULT_CONFIG, playerUrl: baseUrl()}); const {error}=await S.sb.rpc("host_save_config",{p_data:c}); if(error) toast("Could not write defaults: "+error.message); else { toast("First run: default questions loaded"); loadConfig(); } }
async function hostRpc(action, payload){ const {data,error}=await S.sb.rpc("host_action",{p_action:action, p_payload:payload||{}, p_room:S.room}); if(error){ toast(error.message); return null; } if(data){ S.rooms[S.room]={rounds:{}, qIds:[], ...data}; setRoomState(); lastHtml=""; render(); } return data; }

/* ============================ RENDER ROUTER ============================ */
let lastHtml="";
function render(tickOnly=false){
  if(tickOnly && S.route==="host" && S.hostTab!=="run") return;
  let html;
  if(S.route==="tv") html=renderTV(); else if(S.route==="host") html=renderHost(); else html=renderPlayer();
  if(!S.online && S.route!=="tv") html=`<div class="offline">Reconnecting… answers will send when you're back online</div>`+html;
  if(html===lastHtml) return;
  const focus=document.activeElement; const fid=focus&&focus.id, sel=focus&&focus.selectionStart;
  app.innerHTML=html; lastHtml=html; afterRender();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
}
function afterRender(){
  const q=$("#qrbox"); if(q && window.QRCode){ q.innerHTML=""; try{ new QRCode(q,{text:playerUrl(S.room),width:+q.dataset.size||220,height:+q.dataset.size||220,correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
  const rc=$("#resultcanvas"); if(rc) drawResultCard(rc);
}
function baseUrl(){ if(S.cfg.playerUrl) return S.cfg.playerUrl; try{ const u=new URL(location.href); u.hash=""; u.search=""; return u.toString(); }catch(e){ return location.href; } }
function playerUrl(room){ const b=baseUrl(); const rooms=S.cfg.rooms||[]; if(rooms.length<=1 && (!room||room==="A")) return b; return b+(b.includes("?")?"&":"?")+"room="+encodeURIComponent(room||S.room); }
function viewUrl(view, room){ const b=baseUrl(); return b+"?room="+encodeURIComponent(room||S.room)+"#"+view; }
function remaining(){ const st=S.state; const end=st.qEndsAt||0; const ref=st.pausedAt?st.pausedAt:now(); return Math.max(0, Math.ceil((end-ref)/1000)); }
function currentQ(){ const id=(S.state.qIds||[])[S.state.qIndex||0]; return qById(S.cfg,id); }
function timerHtml(total){ const r=remaining(); const pct=total? Math.min(100,r/total*100) : 0; const paused=!!S.state.pausedAt; return `<div class="row" style="justify-content:space-between"><div class="timer num ${r<=10&&!paused?"low":""}">${paused?"⏸":r}</div><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div></div>${paused?`<p class="pill" style="margin:0">${esc(T("paused"))}</p>`:""}`; }
function T(k){ return (S.cfg.texts&&S.cfg.texts[k])||DEFAULT_CONFIG.texts[k]||""; }
function brandHtml(size){ const logo=S.cfg.logo? `<img src="${S.cfg.logo}" alt="" style="height:${size||22}px;width:auto;max-width:160px">` : `<span class="dot"></span>`; return `<div class="brand">${logo}<span>${esc(S.cfg.title)}</span></div>`; }
function head(sub){ return `<div class="row" style="justify-content:space-between;margin-bottom:14px">${brandHtml(22)}<span class="muted" style="font-size:13px">${sub||""}</span></div>`; }
function medalsOf(cfg){ const m=(cfg.medals||[]).filter(x=>x&&x.name); return (m.length?m:DEFAULT_CONFIG.medals).slice().sort((a,b)=>(+a.min||0)-(+b.min||0)); }
function medalFor(score){ const ms=medalsOf(S.cfg); let r=ms[0]; for(const m of ms){ if(score>=(+m.min||0)) r=m; } return r; }
function traitBars(tr, cfg, big=false){ const ts=traitsOf(cfg).filter(t=>tr[t.id]&&tr[t.id].max>0); if(!ts.length) return ""; return `<div class="traits${big?" big":""}">${ts.map(t=>{ const x=tr[t.id]; const pc=x.max?Math.round(100*x.pts/x.max):0; return `<div class="trait"><span class="tn">${esc(t.name)}</span><div class="bar"><i style="width:${pc}%"></i></div><span class="num tv_">${x.pts}/${x.max}</span></div>`; }).join("")}</div>`; }
function hasPlayed(p){ const meta=roundsMeta(); return Object.keys(p.rounds||{}).some(rid=>meta[rid]&&meta[rid].endedAt); }
function lastPlayedRound(p){ const meta=roundsMeta(); let best=null; for(const rid of Object.keys(p.rounds||{})){ if(meta[rid]&&meta[rid].endedAt && (!best||meta[rid].endedAt>meta[best].endedAt)) best=rid; } return best; }
function roundTitle(no){ return T("roundBoardTitle").replace("{no}", no||""); }

/* ============================ PLAYER ============================ */
function renderPlayer(){
  const st=S.state, cfg=S.cfg;
  if(!S.ready) return `<div class="wrap"><div class="card">${head()}<p class="muted">Loading the quiz…</p></div></div>`;
  if(S.authError==="setup") return `<div class="wrap"><div class="card stack">${head()}<h2>Almost there</h2><p>The quiz isn't connected to a database yet (see the setup guide).</p></div></div>`;
  if(S.authError) return `<div class="wrap"><div class="card stack">${head()}<h2>Can't connect</h2><p class="muted">${esc(S.authError)}</p><p>Check your internet connection and reload. If it keeps happening, tell the booth host.</p></div></div>`;
  if(!S.sb || !S.uid) return `<div class="wrap"><div class="card">${head()}<p class="muted">Connecting…</p></div></div>`;
  const me=S.players.find(p=>p.id===S.uid);
  const rid=st.roundId; const inThisRound = me && rid && (me.lastRound===rid || (me.rounds&&me.rounds[rid]));
  // replay rule: already played and not part of the current round
  if(me && !cfg.allowReplays && hasPlayed(me) && !inThisRound){ return renderPlayed(me); }
  if(!S.joined || !me || S.playedBlock){
    if(S.playedBlock && me) return renderPlayed(me);
    return `<div class="wrap"><div class="card stack">${head(esc(roomName(S.room)))}<div><div class="eyebrow">${esc(T("joinEyebrow"))}</div><h1 style="font-size:34px;margin-top:6px">${esc(T("joinTitle"))}</h1></div><p class="muted">${esc(T("joinIntro"))}</p><form id="joinform" class="stack"><div class="field"><label class="f" for="nick">${esc(T("nickLabel"))}</label><input id="nick" maxlength="18" placeholder="${esc(T("nickPlaceholder"))}" value="${esc(S.nick)}" autocomplete="off" required></div><button class="btn" type="submit" ${S.answerBusy?"disabled":""}>${esc(T("joinButton"))}</button></form><p class="muted" style="font-size:13px">${S.players.length} player${S.players.length===1?"":"s"} joined today</p></div></div>`;
  }
  if(st.phase==="idle"||!rid){ return `<div class="wrap stack"><div class="card stack">${head(esc(me.nick))}<h2>${esc(T("inTitle")).replace("{nick}",esc(me.nick))}</h2><p class="muted">${esc(T("waitingIdle"))}</p></div>${globalMini(me)}</div>`; }
  if(st.phase==="lobby"){ const secs=Math.max(0,Math.ceil(((st.lobbyEndsAt||0)-now())/1000)); const inRound=S.players.filter(p=>p.lastRound===rid).length; return `<div class="wrap"><div class="card stack">${head(esc(me.nick))}<div class="eyebrow">${esc(roomName(S.room))} · Round ${st.roundNo}</div><h2>${esc(T("lobbyTitle")).replace("{nick}",esc(me.nick))}</h2><p class="muted">Starts ${secs>0?`in <b class="num">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b>`:"any moment now"}. ${inRound} player${inRound===1?"":"s"} ready.</p><p class="muted" style="margin:0">${esc(T("lobbyRules")).replace("{points}",cfg.pointsCorrect).replace("{bonus}",cfg.speedBonusMax)}</p></div></div>`; }
  const q=currentQ(); const myAns = q && me.rounds && me.rounds[rid] && me.rounds[rid][q.id];
  if(st.phase==="question" && q){
    const total=timerFor(cfg,q); const r=remaining(); const locked=r<=0||S.answerBusy||st.pausedAt;
    return `<div class="wrap"><div class="card stack">${head(`Q${(st.qIndex||0)+1} of ${(st.qIds||[]).length}`)}${timerHtml(total)}<div class="chart">${renderChart(q.chart)}</div><p style="font-weight:600;margin:0">${esc(q.prompt)}</p><div class="options">${q.options.map((o,i)=>`<button class="opt ${myAns&&myAns.c===i?"chosen":""}" data-i="${i}" ${locked?"disabled":""}><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>${myAns?`<p class="pill accent" style="margin:0;white-space:normal">${esc(T("answerSent"))}</p>`:r<=0?`<p class="pill" style="margin:0">${esc(T("timesUp"))}</p>`:""}</div></div>`;
  }
  if(st.phase==="reveal" && q){
    const ok=myAns&&myAns.ok;
    return `<div class="wrap"><div class="card stack">${head(`Q${(st.qIndex||0)+1} of ${(st.qIds||[]).length}`)}<div class="row" style="justify-content:space-between"><span class="pill ${myAns?(ok?"good":"bad"):""}">${myAns?(ok?`${esc(T("correct"))} · +${myAns.pts}`:`${esc(T("wrong"))} · 0`):`${esc(T("noAnswer"))} · 0`}</span><span class="muted num">Score so far: ${roundScore(me,rid).score}/100</span></div><div class="options">${q.options.map((o,i)=>`<button class="opt ${i===q.correct?"correct":(myAns&&myAns.c===i?"wrong":"")}" disabled><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><p style="margin:0"><b>${esc(T("whyLabel"))}</b> ${esc(q.explain)}</p></div></div>`;
  }
  if(st.phase==="board"){ const b=roundBoard(S.players,rid); const idx=b.findIndex(p=>p.id===S.uid); return `<div class="wrap"><div class="card stack">${head(`Round ${st.roundNo}`)}<h2>${esc(roundTitle(st.roundNo))} · after Q${(st.qIndex||0)+1}</h2>${idx>=0?`<p class="muted">You're <b>#${idx+1}</b> of ${b.length} with <b class="num">${b[idx].score}/100</b>.</p>`:""}${boardHtml(b.slice(0,10), S.uid)}</div></div>`; }
  if(st.phase==="ended"){ return renderResult(me, rid, st); }
  return `<div class="wrap"><div class="card">${head()}<p class="muted">${esc(T("waitingIdle"))}</p></div></div>`;
}
function renderPlayed(me){ const rid=lastPlayedRound(me); const meta=roundsMeta()[rid]||{}; const stR=S.rooms[meta.room]||{}; return `<div class="wrap stack"><div class="card stack">${head(esc(me.nick))}<h2>${esc(T("playedTitle")).replace("{nick}",esc(me.nick))}</h2><p class="muted" style="margin:0">${esc(T("playedBlurb"))}</p></div>${rid?renderResult(me, rid, {...stR, roundNo:meta.no}, true):""}</div>`; }
function renderResult(me, rid, st, inner){
  const cfg=S.cfg; const meta=roundsMeta()[rid]||{}; const b=roundBoard(S.players,rid); const idx=b.findIndex(p=>p.id===S.uid); const sc=roundScore(me,rid); const qids=meta.qIds||[]; const medal=medalFor(sc.score);
  const prize=st.prize&&st.prize.id===S.uid?`<div class="notice"><b>${esc(T("prizeYou"))}</b> ${esc(T("prizeYouBlurb"))}</div>`:"";
  const dateStr=meta.endedAt?new Date(meta.endedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";

  return `<div class="tvwrap">${headTv}<div class="tvmain"><div class="stack">${main}</div>${side}</div></div>`;
}

  const prizeCtl = (ph==="ended"||ph==="board"||ph==="reveal") ? `<div class="card stack"><div class="eyebrow">Prize draw</div><p class="muted" style="font-size:13px;margin:0">Picks one random player from this round and shows them on the TV at the end of the round.</p><div class="row"><button class="btn secondary" data-act="prize">Draw a winner</button>${st.prize?`<span class="pill good">Winner: ${esc(st.prize.nick)}</span><button class="btn small secondary" data-act="clearprize">Clear</button>`:""}</div></div>` : "";

  const b=rid?roundBoard(S.players,rid):[]; const g=globalBoard(S.players,roundsMeta(),cfg);

  const danger=`<div class="card stack"><div class="eyebrow">Housekeeping</div><p class="muted" style="font-size:13px;margin:0">The TV and phones for this room follow whatever you do here. Keep this tab open during a question: it triggers the reveal when the timer ends.</p><div class="row"><button class="btn small secondary" data-act="abandon" ${ph==="idle"?"disabled":""}>Abandon current round</button><button class="btn small danger" data-act="wipe">Clear all players & scores (all rooms)</button></div><div id="confirmbox" hidden class="notice stack"><b>Delete every player and all scores for the day, in every room?</b><div class="row"><button class="btn small danger" data-act="wipe-yes">Yes, clear everything</button><button class="btn small secondary" data-act="wipe-no">Keep them</button></div></div></div>`;
  return `<div class="hostlayout"><div class="stack" style="grid-column:1/-1">${topbar}</div><div class="stack">${live}${prizeCtl}${danger}</div><div class="stack">${boards}</div></div>`;

function readSettingsForm(){
  const cfg=clean(S.cfg); const v=id=>{ const el=document.getElementById(id); return el?el.value:undefined; };
  cfg.title=v("s_title")||cfg.title; cfg.timerSec=Math.max(5,+v("s_timer")||45); cfg.pointsCorrect=Math.max(0,+v("s_points")||0); cfg.speedBonusMax=Math.max(0,+v("s_bonus")||0); cfg.lobbyMinutes=Math.max(0,+v("s_lobby")||0); cfg.questionsPerRound=Math.max(0,+v("s_perround")||0); cfg.extendSec=Math.max(1,+v("s_extend")||5); cfg.globalMode=v("s_global")||"best"; cfg.shuffleQuestions=v("s_shuffle")!=="0"; cfg.allowReplays=v("s_replays")==="1"; cfg.playerUrl=(v("s_url")||"").trim(); cfg.accent=(v("s_accent")||"").trim();
  cfg.rooms=(cfg.rooms||[]).map((r,i)=>({id:(v("room_id_"+i)||r.id).replace(/[^A-Za-z0-9]/g,"").slice(0,8)||r.id, name:v("room_name_"+i)||r.name}));
  const seen=new Set(); cfg.rooms=cfg.rooms.filter(r=>{ if(seen.has(r.id)) return false; seen.add(r.id); return true; }); if(!cfg.rooms.length) cfg.rooms=[{id:"A",name:"Booth 1"}];
  cfg.traits=traitsOf(cfg).map((t,i)=>({id:((v("tr_id_"+i)||t.id)+"").toLowerCase().replace(/[^a-z0-9_-]/g,"")||t.id, name:v("tr_name_"+i)||t.name, pts:Math.max(0,+v("tr_pts_"+i)||0)})); delete cfg.bands; cfg.medals=medalsOf(cfg).map((m,i)=>({name:v("md_name_"+i)||m.name, min:Math.max(0,Math.min(100,+v("md_min_"+i)||0)), style:v("md_style_"+i)||m.style||"steel"}));
  cfg.questions=(cfg.questions||[]).map((q,i)=>{ let chart=q.chart; try{ chart=JSON.parse(v("q_chart_"+i)||"{}"); }catch(e){ toast(`Question ${i+1}: chart JSON is not valid, kept the old chart`); } const t=v("q_timer_"+i); const opts=q.options.map((o,j)=>v(`q_opt_${i}_${j}`)??o); return {...q, title:v("q_title_"+i)||q.title, id:(v("q_id_"+i)||q.id).replace(/[^A-Za-z0-9_-]/g,""), timerSec:t?+t:undefined, enabled:v("q_enabled_"+i)!=="0", trait:v("q_trait_"+i)||undefined, set:Math.max(1,+v("q_set_"+i)||1), prompt:v("q_prompt_"+i)??q.prompt, options:opts, correct:Math.min(opts.length-1, +v("q_correct_"+i)||0), explain:v("q_explain_"+i)??q.explain, chart}; });
  const ids=new Set(); for(const q of cfg.questions){ if(!q.id||ids.has(q.id)){ q.id="q"+Math.random().toString(36).slice(2,7); } ids.add(q.id); }
  cfg.texts={}; for(const k of Object.keys(DEFAULT_CONFIG.texts)){ const val=v("t_"+k); cfg.texts[k]=(val==null||val==="")?DEFAULT_CONFIG.texts[k]:val; }
  return cfg;
}
async function saveConfig(cfg){ const {error}=await S.sb.rpc("host_save_config",{p_data:clean(cfg)}); if(error) toast("Could not save: "+error.message); else { S.cfg=cfg; applyBrand(); toast("Settings saved"); } }
function hostAutoAdvance(){ if(S.route!=="host"||!S.isHost||!S.sb) return; const st=S.state; if(st.phase==="question" && !st.pausedAt && now()>(st.qEndsAt||0)+1500){ const key=S.room+"/"+st.roundId+"/"+st.qIndex+"/"+st.qEndsAt; if(S.lastAutoReveal===key) return; S.lastAutoReveal=key; hostRpc("reveal"); } }
function switchRoom(id){ S.room=id; setRoomState(); try{ const u=new URL(location.href); u.searchParams.set("room",id); history.replaceState(null,"",u.toString()); }catch(e){} lastHtml=""; render(); }
async function hostAction(act, el){
  const st=S.state, cfg=S.cfg;
  if(act==="lobby"){ await hostRpc("lobby"); S.lastAutoReveal=null; }
  else if(act==="start"){ const setNo=setForRound(cfg, st.roundNo||1); const qs=questionsForRound(cfg,setNo); if(!qs.length) return toast("No questions enabled in set "+setNo); await hostRpc("start",{qIds:qs.map(q=>q.id), set:setNo}); }
  else if(["cancel","reveal","board","next","pause","resume","abandon","clearprize"].includes(act)){ await hostRpc(act); if(act==="abandon") toast("Round abandoned (its answers no longer count)"); }
  else if(act==="extend"){ await hostRpc("extend",{seconds:cfg.extendSec||5}); }
  else if(act==="prize"){ await hostRpc("prize", {}); }
  else if(act==="wipe"){ $("#confirmbox").hidden=false; }
  else if(act==="wipe-no"){ $("#confirmbox").hidden=true; }
  else if(act==="wipe-yes"){ $("#confirmbox").hidden=true; await hostRpc("wipe"); await loadRooms(); await loadPlayers(); toast("Cleared"); }
  else if(act==="logout"){ await S.sb.auth.signOut(); S.hostUser=null; S.isHost=null; lastHtml=""; render(); }
  else if(act==="toggle-signup"){ S.signupMode=!S.signupMode; lastHtml=""; render(); }
  else if(act==="rename"){ S.editNick=el.dataset.id; lastHtml=""; render(); }
  else if(act==="rename-cancel"){ S.editNick=null; lastHtml=""; render(); }
  else if(act==="remove"){ const {error}=await S.sb.rpc("host_player",{p_id:el.dataset.id, p_action:"remove"}); if(error) toast(error.message); else { toast("Removed"); loadPlayers(); } }
  else if(act==="host-add"){ const em=($("#host_new")||{}).value||""; if(!em.includes("@")) return toast("Enter an email"); const c=readSettingsForm(); const {data,error}=await S.sb.rpc("host_emails_set",{p_action:"add", p_email:em}); if(error) return toast(error.message); S.hosts=data||S.hosts; S.cfg=c; lastHtml=""; render(); toast("Host added. They can now create their password on the host page."); }
  else if(act==="host-del"){ const c=readSettingsForm(); const {data,error}=await S.sb.rpc("host_emails_set",{p_action:"remove", p_email:el.dataset.email}); if(error) return toast(error.message); S.hosts=data||S.hosts; S.cfg=c; lastHtml=""; render(); }
  else if(act==="room-add"){ const c=readSettingsForm(); const used=new Set(c.rooms.map(r=>r.id)); let id="B"; for(const ch of "BCDEFGH"){ if(!used.has(ch)){ id=ch; break; } } c.rooms.push({id, name:"Booth "+(c.rooms.length+1)}); S.cfg=c; lastHtml=""; render(); toast("Room added. Save to keep it."); }
  else if(act==="room-del"){ const c=readSettingsForm(); c.rooms.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  // settings actions
  else if(act==="trait-add"){ const c=readSettingsForm(); c.traits.push({id:"trait"+(c.traits.length+1),name:"New trait",pts:3}); S.cfg=c; lastHtml=""; render(); }
  else if(act==="medal-add"){ const c=readSettingsForm(); c.medals.push({name:"New medal",min:0,style:"steel"}); S.cfg=c; lastHtml=""; render(); }
  else if(act==="medal-del"){ const c=readSettingsForm(); c.medals.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  else if(act==="trait-del"){ const c=readSettingsForm(); c.traits.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  else if(act==="opt-add"){ const c=readSettingsForm(); const q=c.questions[+el.dataset.i]; if(q.options.length<6) q.options.push(""); S.cfg=c; lastHtml=""; render(); openQ(+el.dataset.i); }
  else if(act==="opt-del"){ const c=readSettingsForm(); const q=c.questions[+el.dataset.i]; if(q.options.length>2){ q.options.pop(); q.correct=Math.min(q.correct,q.options.length-1); } S.cfg=c; lastHtml=""; render(); openQ(+el.dataset.i); }
  else if(act==="q-add"){ const c=readSettingsForm(); c.questions.push({id:"q"+Math.random().toString(36).slice(2,7), enabled:true, set:1, trait:(traitsOf(c)[0]||{}).id, title:"New question", prompt:"", chart:{type:"none"}, options:["","","",""], correct:0, explain:""}); S.cfg=c; lastHtml=""; render(); openQ(c.questions.length-1, true); }
  else if(act==="q-del"){ const c=readSettingsForm(); c.questions.splice(+el.dataset.i,1); S.cfg=c; lastHtml=""; render(); }
  else if(act==="q-up"||act==="q-down"){ const c=readSettingsForm(); const i=+el.dataset.i, j=act==="q-up"?i-1:i+1; if(j<0||j>=c.questions.length) return; [c.questions[i],c.questions[j]]=[c.questions[j],c.questions[i]]; S.cfg=c; lastHtml=""; render(); }
  else if(act==="restore"){ const c=readSettingsForm(); c.questions=clean(DEFAULT_CONFIG.questions); S.cfg=c; lastHtml=""; render(); toast("Default questions loaded. Save to keep them."); }
  else if(act==="import"){ try{ const c={...DEFAULT_CONFIG, ...JSON.parse($("#s_json").value)}; S.cfg=c; lastHtml=""; render(); toast("Loaded. Save to keep it."); }catch(e){ toast("That JSON didn't parse"); } }
  else if(act==="logo-clear"){ const c=readSettingsForm(); c.logo=""; S.cfg=c; lastHtml=""; render(); toast("Logo removed. Save to keep it."); }
}
function openQ(i, scroll){ setTimeout(()=>{ const d=document.getElementById("qd_"+i); if(d){ d.open=true; if(scroll) d.scrollIntoView({behavior:"smooth"}); } },30); }

/* ============================ EVENTS ============================ */
app.addEventListener("click", async e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ if(S.hostTab==="settings"&&tab.dataset.tab!=="settings"){ S.cfg=readSettingsForm(); } S.hostTab=tab.dataset.tab; if(S.hostTab==="settings") checkHost(); lastHtml=""; render(); return; }
  const act=e.target.closest("[data-act]"); if(act){ e.preventDefault(); if(act.dataset.act==="sharecard") return shareCard(); await hostAction(act.dataset.act, act); return; }
  const opt=e.target.closest(".opt[data-i]"); if(opt && S.route!=="tv" && S.route!=="host"){ await answer(+opt.dataset.i); }
});
app.addEventListener("change", e=>{ if(e.target.id==="setsel"){ S.setChoice=e.target.value; ls.set("dd_set",S.setChoice); lastHtml=""; render(); return; } if(e.target.id==="roomsel"){ if(S.hostTab==="settings") S.cfg=readSettingsForm(); switchRoom(e.target.value); } if(e.target.id==="s_logo"){ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>200*1024) return toast("Logo must be under 200 KB"); const r=new FileReader(); r.onload=()=>{ const c=readSettingsForm(); c.logo=r.result; S.cfg=c; lastHtml=""; render(); toast("Logo loaded. Save to keep it."); }; r.readAsDataURL(f); } });
app.addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="joinform"){ const nick=$("#nick").value.trim().slice(0,18); if(!nick) return; S.nick=nick; ls.set("dd_nick",nick); S.answerBusy=true; lastHtml=""; render(); const {error}=await S.sb.rpc("join_game",{p_nick:nick, p_room:S.room}); S.answerBusy=false; if(error){ if(/already played/i.test(error.message)){ S.playedBlock=true; await loadPlayers(); } else toast("Could not join: "+error.message); } else { S.joined=true; S.playedBlock=false; ls.set("dd_joined","1"); S.lastRoundSeen=S.state.roundId||null; toast("You're in!"); await loadPlayers(); } lastHtml=""; render(); }
  if(e.target.id==="loginform"){ const email=$("#h_email").value.trim(), password=$("#h_pass").value; if(!email||!password) return toast("Enter the host email and password"); S.loginBusy=true; lastHtml=""; render(); let error; if(S.signupMode){ const r=await S.sb.auth.signUp({email, password}); error=r.error; if(!error && !(r.data&&r.data.session)){ const r2=await S.sb.auth.signInWithPassword({email,password}); error=r2.error; } } else { const r=await S.sb.auth.signInWithPassword({email, password}); error=r.error; } if(error) toast(/invalid/i.test(error.message)?"Email or password not recognised":error.message); S.loginBusy=false; lastHtml=""; render(); }
  if(e.target.id==="settingsform"){ const c=readSettingsForm(); await saveConfig(c); lastHtml=""; render(); }
  const rn=e.target.dataset.rename; if(rn){ const val=document.getElementById("rn_"+rn).value.trim().slice(0,18); if(!val) return; const {error}=await S.sb.rpc("host_player",{p_id:rn, p_action:"rename", p_nick:val}); if(error) toast(error.message); S.editNick=null; await loadPlayers(); lastHtml=""; render(); }
});
app.addEventListener("input", e=>{ if(S.route==="host"&&S.hostTab==="settings"&&e.target.id.startsWith("q_chart_")){ try{ const spec=JSON.parse(e.target.value); const box=e.target.closest(".body").querySelector(".chart"); if(box) box.innerHTML=renderChart(spec); }catch(err){} } });
async function answer(i){
  const st=S.state, q=currentQ(); if(!q||st.phase!=="question"||S.answerBusy||st.pausedAt) return;
  const me=S.players.find(p=>p.id===S.uid); if(!me) return;
  const prev=me.rounds&&me.rounds[st.roundId]&&me.rounds[st.roundId][q.id]; if(prev&&prev.c===i) return;
  if(now()>(st.qEndsAt||0)+1000) return toast(T("timesUp"));
  S.answerBusy=true; lastHtml=""; render();
  const {data,error}=await S.sb.rpc("submit_answer",{p_choice:i, p_room:S.room});
  if(error){ toast(error.message); } else if(data){ me.rounds=me.rounds||{}; me.rounds[st.roundId]=me.rounds[st.roundId]||{}; me.rounds[st.roundId][q.id]={c:i, ms:data.ms, ok:data.ok, pts:data.pts}; }
  S.answerBusy=false; lastHtml=""; render();
}
// when a new lobby opens in this room while a joined phone is open, re-join so the player counts for that round (unless the replay rule blocks it)
setInterval(async()=>{ if(S.route||!S.sb||!S.uid||!S.joined||S.playedBlock) return; const rid=S.state.roundId; if(rid&&rid!==S.lastRoundSeen){ S.lastRoundSeen=rid; const me=S.players.find(p=>p.id===S.uid); if(me&&me.lastRound!==rid){ if(!S.cfg.allowReplays && hasPlayed(me)){ S.playedBlock=true; lastHtml=""; render(); return; } const {error}=await S.sb.rpc("join_game",{p_nick:me.nick, p_room:S.room}); if(error&&/already played/i.test(error.message)){ S.playedBlock=true; lastHtml=""; render(); } } } },1500);
boot();
</script>
